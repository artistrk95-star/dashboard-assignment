<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qistna ERP — UAE Trade &amp; VAT Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   RESET + BASE
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --font-sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --font-arabic:'IBM Plex Sans Arabic','Plus Jakarta Sans',system-ui,sans-serif;
  --canvas-bg:#FCFDFE; --surface-dark:#162A45;
  --navy:#162A45; --navy2:#1E3A5F;
  --blue:#2563EB; --blue-deep:#1E40AF; --brand-azure:#2563EB;
  --cyan:#0EA5E9; --purple:#8B5CF6; --orange:#F97316; --brand-cyan:#0EA5E9; --brand-peach:#F97316;
  --teal:#06B6D4; --emerald:#10B981; --emerald-deep:#059669;
  --rose:#DC2626;
  --ink:#0F172A;
  --slate-400:#94A3B8; --slate-500:#64748B; --slate-600:#475569;
  --slate-700:#334155; --slate-200:#E2E8F0; --slate-100:#F1F5F9; --slate-50:#F8FAFC;
}
html,body{height:100%;}
body{
  font-family:var(--font-sans);
  color:var(--ink);
  background:#FAFCFE;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  font-size:14px;
  line-height:1.45;
}
html[dir="rtl"] body{font-family:var(--font-arabic);}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
svg{width:16px;height:16px;flex-shrink:0;display:inline-block;vertical-align:middle;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;}
.mono{font-family:var(--font-mono);}
.tabular{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-track{background:rgba(241,245,249,.6);}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:9999px;}
::-webkit-scrollbar-thumb:hover{background:#94A3B8;}

/* =====================================================================
   LAYOUT PRIMITIVES (small hand-rolled utility set)
   ===================================================================== */
.flex{display:flex;} .grid{display:grid;} .hidden{display:none !important;}
.items-center{align-items:center;} .items-start{align-items:flex-start;} .items-baseline{align-items:baseline;}
.justify-between{justify-content:space-between;} .justify-center{justify-content:center;} .justify-end{justify-content:flex-end;}
.flex-col{flex-direction:column;} .flex-wrap{flex-wrap:wrap;} .flex-1{flex:1 1 0%;}
.gap-1{gap:4px;} .gap-1_5{gap:6px;} .gap-2{gap:8px;} .gap-2_5{gap:10px;} .gap-3{gap:12px;} .gap-4{gap:16px;} .gap-5{gap:20px;} .gap-6{gap:24px;} .gap-8{gap:32px;}
.w-full{width:100%;} .h-full{height:100%;}
.relative{position:relative;} .absolute{position:absolute;} .fixed{position:fixed;} .sticky{position:sticky;}
.text-center{text-align:center;} .text-right{text-align:right;} .text-left{text-align:left;}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rounded-full{border-radius:999px;} .rounded-2xl{border-radius:18px;} .rounded-3xl{border-radius:26px;} .rounded-xl{border-radius:14px;} .rounded-lg{border-radius:10px;} .rounded-md{border-radius:7px;}
.cursor-pointer{cursor:pointer;} .cursor-not-allowed{cursor:not-allowed;}
.select-none{user-select:none;}
.pointer-events-none{pointer-events:none;}
.overflow-x-auto{overflow-x:auto;} .overflow-y-auto{overflow-y:auto;} .overflow-hidden{overflow:hidden;}
.w-max{width:max-content;}
[hidden]{display:none !important;}

/* Spacing helpers */
.p-1{padding:4px;} .p-1_5{padding:6px;} .p-2{padding:8px;} .p-2_5{padding:10px;} .p-3{padding:12px;} .p-3_5{padding:14px;} .p-4{padding:16px;} .p-5{padding:20px;} .p-6{padding:24px;} .p-7{padding:28px;}
.px-2{padding-left:8px;padding-right:8px;} .px-2_5{padding-left:10px;padding-right:10px;} .px-3{padding-left:12px;padding-right:12px;} .px-3_5{padding-left:14px;padding-right:14px;} .px-4{padding-left:16px;padding-right:16px;}
.py-0_5{padding-top:2px;padding-bottom:2px;} .py-1{padding-top:4px;padding-bottom:4px;} .py-1_5{padding-top:6px;padding-bottom:6px;} .py-2{padding-top:8px;padding-bottom:8px;} .py-2_5{padding-top:10px;padding-bottom:10px;} .py-3{padding-top:12px;padding-bottom:12px;} .py-3_5{padding-top:14px;padding-bottom:14px;} .py-4{padding-top:16px;padding-bottom:16px;} .py-6{padding-top:24px;padding-bottom:24px;} .py-8{padding-top:32px;padding-bottom:32px;}
.mt-0_5{margin-top:2px;} .mt-1{margin-top:4px;} .mt-1_5{margin-top:6px;} .mt-2{margin-top:8px;} .mt-3{margin-top:12px;} .mt-4{margin-top:16px;} .mt-5{margin-top:20px;} .mt-6{margin-top:24px;} .mt-7{margin-top:28px;} .mt-8{margin-top:32px;}
.mb-1{margin-bottom:4px;} .mb-1_5{margin-bottom:6px;} .mb-2{margin-bottom:8px;} .mb-3{margin-bottom:12px;} .mb-4{margin-bottom:16px;} .mb-5{margin-bottom:20px;} .mb-6{margin-bottom:24px;} .mb-7{margin-bottom:28px;} .mb-8{margin-bottom:32px;}
.pt-1{padding-top:4px;} .pt-2{padding-top:8px;} .pt-3{padding-top:12px;} .pt-4{padding-top:16px;}
.pb-1{padding-bottom:4px;} .pb-2{padding-bottom:8px;} .pb-3{padding-bottom:12px;} .pb-4{padding-bottom:16px;} .pb-12{padding-bottom:48px;}
.space-y-1_5 > * + *{margin-top:6px;} .space-y-2 > * + *{margin-top:8px;} .space-y-2_5 > * + *{margin-top:10px;} .space-y-3 > * + *{margin-top:12px;} .space-y-4 > * + *{margin-top:16px;} .space-y-5 > * + *{margin-top:20px;} .space-y-6 > * + *{margin-top:24px;} .space-y-8 > * + *{margin-top:32px;}

/* Typography helpers */
.text-xs{font-size:11px;} .text-sm{font-size:12.5px;} .text-base{font-size:14px;} .text-lg{font-size:16px;} .text-xl{font-size:19px;} .text-2xl{font-size:24px;} .text-3xl{font-size:29px;}
.font-medium{font-weight:500;} .font-semibold{font-weight:600;} .font-bold{font-weight:700;} .font-extrabold{font-weight:800;} .font-black{font-weight:900;}
.tracking-tight{letter-spacing:-.01em;} .uppercase{text-transform:uppercase;} .tracking-wider{letter-spacing:.06em;}
.leading-relaxed{line-height:1.65;}
.whitespace-nowrap{white-space:nowrap;}
.text-white{color:#fff;}
.text-slate-400{color:var(--slate-400);} .text-slate-500{color:var(--slate-500);} .text-slate-600{color:var(--slate-600);} .text-slate-700{color:var(--slate-700);} .text-slate-800{color:#1E293B;} .text-slate-900{color:var(--ink);}
.text-blue{color:var(--blue);} .text-cyan{color:var(--cyan);} .text-orange{color:var(--orange);} .text-emerald{color:var(--emerald-deep);} .text-rose{color:var(--rose);} .text-navy{color:var(--navy);}

/* Grid helpers */
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.col-span-2{grid-column:span 2;}
@media(max-width:1080px){ .grid-3{grid-template-columns:1fr;} .col-span-2{grid-column:span 1;} }
@media(max-width:720px){ .grid-2{grid-template-columns:1fr;} }

/* =====================================================================
   GLASSMORPHISM DESIGN TOKENS — ported verbatim from src/index.css
   (2026 Frosted Glass Morphism System)
   ===================================================================== */
.glass-card{
  background:linear-gradient(135deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.78) 50%,rgba(248,250,252,.82) 100%);
  backdrop-filter:blur(28px) saturate(190%) contrast(105%);
  -webkit-backdrop-filter:blur(28px) saturate(190%) contrast(105%);
  border:1px solid rgba(255,255,255,.88);
  box-shadow:0 4px 6px -1px rgba(15,23,42,.02),0 16px 36px -4px rgba(15,23,42,.04),inset 0 1px 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px 0 rgba(15,23,42,.02);
  transition:all .25s cubic-bezier(.16,1,.3,1);
}
.glass-card:hover{
  border-color:rgba(255,255,255,1);
  box-shadow:0 8px 16px -2px rgba(15,23,42,.03),0 24px 48px -6px rgba(15,23,42,.06),inset 0 1px 2px 0 rgba(255,255,255,1);
  transform:translateY(-2px);
}
.glass-card-subtle{
  background:linear-gradient(135deg,rgba(255,255,255,.75) 0%,rgba(248,250,252,.60) 100%);
  backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.80);
  box-shadow:0 4px 16px -2px rgba(15,23,42,.02),inset 0 1px 1px 0 rgba(255,255,255,.9);
}
.glass-drawer{
  background:linear-gradient(180deg,rgba(255,255,255,.88) 0%,rgba(255,255,255,.76) 45%,rgba(246,250,255,.82) 100%);
  backdrop-filter:blur(32px) saturate(200%) contrast(105%); -webkit-backdrop-filter:blur(32px) saturate(200%) contrast(105%);
  border-right:1px solid rgba(255,255,255,.85);
  box-shadow:4px 0 24px -2px rgba(15,23,42,.03),16px 0 48px -8px rgba(15,23,42,.03),inset -1px 0 1px 0 rgba(255,255,255,.95);
}
html[dir="rtl"] .glass-drawer{border-right:none;border-left:1px solid rgba(255,255,255,.85);box-shadow:-4px 0 24px -2px rgba(15,23,42,.03),-16px 0 48px -8px rgba(15,23,42,.03),inset 1px 0 1px 0 rgba(255,255,255,.95);}
.glass-nav-active{
  background:linear-gradient(135deg,#162A45 0%,#1E3A5F 100%);
  color:#fff !important;border:1px solid rgba(255,255,255,.25);
  box-shadow:0 8px 20px -3px rgba(22,42,69,.28),0 2px 6px -1px rgba(22,42,69,.15),inset 0 1px 1px 0 rgba(255,255,255,.35);
}
.glass-nav-inactive{border:1px solid transparent;transition:all .2s cubic-bezier(.16,1,.3,1);}
.glass-nav-inactive:hover{
  background:linear-gradient(135deg,rgba(255,255,255,.9) 0%,rgba(241,245,249,.75) 100%);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 4px 12px -2px rgba(15,23,42,.03),inset 0 1px 1px rgba(255,255,255,.9);
}
.glass-kpi-blue{
  background:linear-gradient(145deg,rgba(238,245,255,.90) 0%,rgba(224,238,255,.78) 50%,rgba(240,247,255,.85) 100%);
  backdrop-filter:blur(28px) saturate(190%); -webkit-backdrop-filter:blur(28px) saturate(190%);
  border:1px solid rgba(255,255,255,.92);
  box-shadow:0 8px 24px -4px rgba(37,99,235,.06),0 2px 6px -1px rgba(37,99,235,.03),inset 0 1px 1px 0 rgba(255,255,255,.98);
  transition:all .25s cubic-bezier(.16,1,.3,1);
}
.glass-kpi-blue:hover{transform:translateY(-2px);border-color:rgba(255,255,255,1);box-shadow:0 16px 36px -6px rgba(37,99,235,.12);}
.glass-kpi-cyan{
  background:linear-gradient(145deg,rgba(236,253,254,.90) 0%,rgba(218,250,253,.78) 50%,rgba(238,253,254,.85) 100%);
  backdrop-filter:blur(28px) saturate(190%); -webkit-backdrop-filter:blur(28px) saturate(190%);
  border:1px solid rgba(255,255,255,.92);
  box-shadow:0 8px 24px -4px rgba(6,182,212,.06),0 2px 6px -1px rgba(6,182,212,.03),inset 0 1px 1px 0 rgba(255,255,255,.98);
  transition:all .25s cubic-bezier(.16,1,.3,1);
}
.glass-kpi-cyan:hover{transform:translateY(-2px);border-color:rgba(255,255,255,1);box-shadow:0 16px 36px -6px rgba(6,182,212,.12);}
.glass-kpi-peach{
  background:linear-gradient(145deg,rgba(255,246,240,.92) 0%,rgba(255,238,227,.80) 50%,rgba(255,248,243,.88) 100%);
  backdrop-filter:blur(28px) saturate(190%); -webkit-backdrop-filter:blur(28px) saturate(190%);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 8px 24px -4px rgba(249,115,22,.06),0 2px 6px -1px rgba(249,115,22,.03),inset 0 1px 1px 0 rgba(255,255,255,.98);
  transition:all .25s cubic-bezier(.16,1,.3,1);
}
.glass-kpi-peach:hover{transform:translateY(-2px);border-color:rgba(255,255,255,1);box-shadow:0 16px 36px -6px rgba(249,115,22,.12);}
.glass-pill{
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 2px 8px rgba(15,23,42,.03),inset 0 1px 1px rgba(255,255,255,.9);
}
.glass-modal{
  background:linear-gradient(155deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.92) 50%,rgba(248,250,252,.94) 100%);
  backdrop-filter:blur(36px) saturate(200%) contrast(105%); -webkit-backdrop-filter:blur(36px) saturate(200%) contrast(105%);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 24px 60px -12px rgba(15,23,42,.15),0 8px 24px -4px rgba(15,23,42,.05),inset 0 1px 2px 0 rgba(255,255,255,1);
}

/* =====================================================================
   AMBIENT MORPHISM BACKGROUND — ported from MorphismBackground.tsx
   ===================================================================== */
.bg-scene{position:fixed;inset:0;z-index:-1;background:#FCFDFE;overflow:hidden;}
.bg-scene .silk-layer{position:absolute;inset:0;width:100%;height:100%;opacity:.5;}
.bg-scene .amber-glow-1{position:absolute;top:-64px;right:-64px;width:700px;height:500px;pointer-events:none;
  background:radial-gradient(circle at 75% 25%,rgba(251,191,36,.42) 0%,rgba(253,186,116,.32) 28%,rgba(254,215,170,.18) 50%,rgba(255,247,237,.05) 75%,transparent 100%);
  filter:blur(50px);}
.bg-scene .amber-glow-2{position:absolute;top:0;right:0;width:550px;height:280px;pointer-events:none;opacity:.8;
  background:radial-gradient(ellipse 65% 50% at 85% 10%,rgba(249,115,22,.28) 0%,rgba(251,146,60,.18) 40%,transparent 80%);
  filter:blur(35px);}
.bg-scene .white-balance{position:absolute;inset:0;background:linear-gradient(to top right,rgba(255,255,255,.7),transparent 60%);pointer-events:none;}

/* =====================================================================
   APP SHELL
   ===================================================================== */
.app-shell{display:flex;min-height:100vh;position:relative;}
.sidebar{width:256px;flex-shrink:0;height:100vh;position:sticky;top:0;z-index:40;}
.sidebar-inner{display:flex;flex-direction:column;height:100%;width:100%;overflow:hidden;color:var(--slate-700);}
.brand{padding:24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.6);}
.brand-logo{width:40px;height:40px;border-radius:18px;background:var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -4px rgba(15,23,42,.3);border:1px solid rgba(255,255,255,.2);}
.brand-dots{display:grid;grid-template-columns:repeat(3,4px);gap:3px;}
.brand-dots span{width:4px;height:4px;border-radius:1px;background:#fff;}
.brand-dots span:nth-child(5){background:var(--blue);}
.brand-name{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.01em;}
.brand-sub{font-size:10.5px;color:var(--slate-500);font-weight:500;}
.nav{flex:1;padding:16px 14px;overflow-y:auto;}
.nav-label{padding:4px 12px 8px;font-size:10.5px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.06em;}
.nav-item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:18px;font-size:13px;font-weight:500;color:var(--slate-600);margin-bottom:6px;transition:.2s;}
.nav-item.active{font-weight:600;color:#fff;}
.nav-item .nav-left{display:flex;align-items:center;gap:12px;}
.nav-item svg{width:16px;height:16px;color:#94A3B8;flex-shrink:0;}
.nav-item.active svg{color:#fff;}
.nav-badge{font-size:11px;font-weight:600;padding:1px 9px;border-radius:999px;background:#EFF6FF;color:var(--blue);border:1px solid #DBEAFE;}
.nav-item.active .nav-badge{background:rgba(255,255,255,.2);color:#fff;border-color:transparent;}
.nav-item.disabled{color:#B9C2CF;cursor:not-allowed;opacity:.75;}
.nav-item.disabled svg{color:#CBD5E1;}
.nav-soon{font-size:9.5px;font-weight:700;color:var(--slate-400);background:rgba(241,245,249,.8);padding:2px 8px;border-radius:999px;border:1px solid rgba(226,232,240,.6);}
.sidebar-footer{margin:0 14px 16px;padding:16px;border-radius:18px;font-size:11px;}
.mobile-menu-btn{display:none;padding:8px;border-radius:14px;align-items:center;justify-content:center;color:var(--slate-700);width:auto;height:auto;}
.mobile-menu-btn svg{width:20px;height:20px;}
@media(max-width:1024px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;box-shadow:0 25px 60px rgba(15,23,42,.25);}
  html[dir="rtl"] .sidebar{left:auto;right:0;transform:translateX(100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.3);backdrop-filter:blur(4px);z-index:39;display:none;}
  .sidebar-backdrop.open{display:block;}
  .mobile-menu-btn{display:flex;}
}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.header{position:sticky;top:0;z-index:30;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.5);backdrop-filter:blur(24px);}
.kbd{font-size:10px;font-family:var(--font-mono);padding:3px 8px;background:#F1F3F4;border-radius:6px;border:1px solid #E8EAED;color:#80868B;}
.currency-pill{display:flex;align-items:center;border-radius:999px;padding:4px;}
.currency-pill button{padding:5px 10px;font-size:11px;font-weight:700;border-radius:999px;color:var(--slate-500);}
.currency-pill button.active{background:var(--navy);color:#fff;}
.header-btn{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--slate-600);position:relative;}
.header-btn svg{width:16px;height:16px;}
.dot-badge{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:999px;background:var(--blue);border:2px solid #fff;}
.btn-cta{display:flex;align-items:center;gap:6px;padding:9px 16px;font-size:var(--fs-xs);font-weight:var(--fw-bold);color:#fff;background:var(--navy);border-radius:999px;box-shadow:0 6px 14px -4px rgba(15,23,42,.3);border:1px solid rgba(255,255,255,.2);}
.btn-cta:hover{background:var(--navy2);}
.btn-cta svg{width:14px;height:14px;}

.page-container{padding:32px;max-width:1600px;width:100%;margin:0 auto;}
@media(max-width:640px){.page-container{padding:16px;}}
.page{display:none;}
.page.active{display:block;}

/* =====================================================================
   BUTTONS
   ===================================================================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;border-radius:14px;transition:.15s;white-space:nowrap;user-select:none;border:1px solid transparent;}
.btn:active{transform:scale(.98);}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn svg{width:14px;height:14px;flex-shrink:0;}
.btn-sm{font-size:11.5px;padding:7px 13px;gap:6px;}
.btn-md{font-size:12.5px;padding:9px 16px;}
.btn-lg{font-size:14px;padding:11px 24px;}
.btn-primary{background:var(--navy);color:#fff;border-color:rgba(22,42,69,.3);box-shadow:0 2px 6px rgba(15,23,42,.15);}
.btn-primary:hover{background:var(--navy2);}
.btn-secondary{background:rgba(255,255,255,.8);color:#1E293B;border-color:rgba(255,255,255,.8);}
.btn-secondary:hover{background:#fff;}
.btn-outline{background:#fff;color:var(--slate-700);border-color:#E2E8F0;}
.btn-outline:hover{background:var(--slate-50);}
.btn-destructive{background:#E11D48;color:#fff;border-color:rgba(190,18,60,.3);}
.btn-destructive:hover{background:#BE123C;}
.btn-ghost{color:var(--slate-600);}
.btn-ghost:hover{color:#0F172A;background:rgba(255,255,255,.6);}

/* Inputs / Selects */
.field{display:flex;flex-direction:column;gap:6px;width:100%;}
.field label{font-size:11.5px;font-weight:600;color:var(--slate-700);}
.field label .req{color:#E11D48;margin-left:2px;}
.field input, .field select, .field textarea{width:100%;border-radius:9px;border:1px solid #CBD5E1;background:#fff;padding:9px 12px;font-size:12.5px;color:#0F172A;transition:.15s;}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--emerald-deep);box-shadow:0 0 0 3px rgba(16,185,129,.15);}
.field.has-error input, .field.has-error select{border-color:#FB7185;}
.field .help{font-size:10.5px;color:var(--slate-500);}
.field .err{font-size:10.5px;color:#E11D48;font-weight:600;}
.chk-label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--slate-600);cursor:pointer;}
.chk-label input{width:15px;height:15px;accent-color:#E11D48;}

/* Status chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:500;border-radius:7px;border:1px solid;padding:2px 9px;font-size:11px;white-space:nowrap;}
.chip .dot{width:6px;height:6px;border-radius:999px;flex-shrink:0;}
.chip-paid{background:rgba(236,253,245,.7);border-color:#A7F3D0;color:#065F46;} .chip-paid .dot{background:#059669;}
.chip-sent{background:rgba(239,246,255,.7);border-color:#BFDBFE;color:#1E40AF;} .chip-sent .dot{background:#2563EB;}
.chip-overdue{background:rgba(255,241,242,.7);border-color:#FECDD3;color:#9F1239;} .chip-overdue .dot{background:#E11D48;animation:pulse 1.6s infinite;}
.chip-draft{background:#F1F5F9;border-color:#E2E8F0;color:#334155;} .chip-draft .dot{background:#94A3B8;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

/* Toasts */
.toast-host{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:10px;width:320px;max-width:calc(100vw - 32px);}
html[dir="rtl"] .toast-host{right:auto;left:20px;}
.toast{display:flex;align-items:flex-start;gap:10px;padding:14px;border-radius:16px;font-size:12px;animation:toastIn .2s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.toast svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;}
.toast-title{font-weight:700;color:#0F172A;}
.toast-msg{color:var(--slate-600);margin-top:2px;}
.toast-close{margin-left:auto;color:var(--slate-400);}
.toast-info svg{color:#2563EB;} .toast-success svg{color:#059669;} .toast-warning svg{color:#D97706;} .toast-error svg{color:#E11D48;}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(4px);}
.modal-box{position:relative;z-index:2;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:26px;padding:26px;animation:modalIn .18s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.6);margin-bottom:16px;}
.modal-close{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--slate-500);}
.modal-close svg{width:17px;height:17px;}
.modal-foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--slate-100);display:flex;align-items:center;justify-content:space-between;gap:10px;}

/* Command palette */
.cmdk-box{max-width:560px;width:100%;}
.cmdk-input{width:100%;border:none;background:transparent;font-size:15px;padding:16px 20px;border-bottom:1px solid var(--slate-100);}
.cmdk-input:focus{outline:none;}
.cmdk-list{max-height:340px;overflow-y:auto;padding:8px;}
.cmdk-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:12.5px;color:var(--slate-700);}
.cmdk-item:hover, .cmdk-item.sel{background:#EFF6FF;color:var(--blue-deep);}
.cmdk-item svg{width:14px;height:14px;color:var(--slate-400);}
.cmdk-empty{padding:24px;text-align:center;color:var(--slate-400);font-size:12px;}

/* Cards / generic */
.card{border-radius:26px;padding:28px;}
.card-title{font-size:15px;font-weight:700;color:#0F172A;letter-spacing:-.01em;}
.divider{height:1px;background:var(--slate-100);}
.badge{font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;background:#EFF6FF;color:var(--blue);border:1px solid #DBEAFE;font-family:var(--font-mono);}

/* Table */
table{width:100%;border-collapse:collapse;}
.table-wrap{overflow-x:auto;}
th{text-align:left;font-size:10.5px;font-weight:700;color:var(--slate-600);padding:10px 12px;background:rgba(241,245,249,.8);border-bottom:1px solid var(--slate-200);white-space:nowrap;}
td{padding:10px 12px;font-size:11.5px;border-bottom:1px solid var(--slate-100);vertical-align:middle;}
tr.row-hover:hover td{background:rgba(248,250,252,.8);}
th.th-sort{cursor:pointer;}
.th-sort-inner{display:flex;align-items:center;gap:5px;}
.th-sort svg{width:11px;height:11px;}


/* =====================================================================
   DASHBOARD v2 — cards matched to reference images
   ===================================================================== */
.num{font-family:var(--font-mono);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.acc-blue{--acc:#2563EB;--acc-track:rgba(37,99,235,.11);}
.acc-cyan{--acc:#0EA5E9;--acc-track:rgba(14,165,233,.13);}
.acc-orange{--acc:#F97316;--acc-track:rgba(249,115,22,.14);}
.kpi2{border-radius:28px;padding:28px 28px 26px;display:flex;flex-direction:column;}
.kpi2-title{font-size:15px;font-weight:700;color:#1E293B;letter-spacing:-.01em;}
.kpi2-row{display:flex;align-items:center;gap:14px;margin-top:20px;flex-wrap:wrap;}
.kpi2-value{font-size:32px;line-height:1;color:var(--acc);}
.kpi2-sep{width:1px;height:26px;background:rgba(148,163,184,.35);}
.kpi2-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:#64748B;white-space:nowrap;}
.kpi2-meta b{font-weight:700;display:inline-flex;align-items:center;gap:3px;color:var(--acc);}
.kpi2-meta b svg{width:13px;height:13px;stroke-width:2.4;}
.kpi2-slider{position:relative;height:6px;border-radius:99px;margin:28px 0 26px;background:var(--acc-track);}
.kpi2-slider .fill{position:absolute;inset-inline-start:0;top:0;bottom:0;border-radius:99px;background:var(--acc);}
.kpi2-slider .knob{position:absolute;top:50%;width:16px;height:16px;border-radius:99px;background:var(--acc);border:2.5px solid #fff;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(15,23,42,.2);}
html[dir="rtl"] .kpi2-slider .knob{transform:translate(50%,-50%);}
.kpi2-link{font-size:14px;font-weight:700;align-self:flex-start;color:var(--acc);}
.kpi2-link:hover{text-decoration:underline;text-underline-offset:3px;}
.dcard{border-radius:28px;padding:34px 34px 30px;}
.card-h{font-size:20px;font-weight:700;letter-spacing:-.02em;color:#0F172A;}
.seg{display:inline-flex;align-items:center;padding:4px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 6px 18px -6px rgba(15,23,42,.10),inset 0 1px 1px #fff;border:1px solid rgba(241,245,249,.95);}
.seg button{padding:7px 17px;border-radius:999px;font-size:14px;font-weight:500;color:#475569;transition:.15s;}
.seg button:hover{color:#0F172A;}
.seg button.on{background:#162A45;color:#fff;box-shadow:0 4px 10px -3px rgba(22,42,69,.4);}
.more-btn{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#64748B;background:rgba(255,255,255,.92);box-shadow:0 6px 18px -6px rgba(15,23,42,.10),inset 0 1px 1px #fff;border:1px solid rgba(241,245,249,.95);}
.more-btn svg{width:18px;height:18px;}
.more-btn.ghost{background:none;box-shadow:none;border:none;color:#CBD5E1;}
.gap-12{gap:48px;}
.period-label{font-size:13.5px;color:#64748B;}
.period-value{font-size:30px;line-height:1.1;}
.period-value small{font-size:13px;font-weight:600;margin-inline-end:4px;opacity:.7;letter-spacing:0;}
.delta{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;}
.delta::before{content:'';width:6px;height:6px;border-radius:99px;}
.delta.up{background:#DCFCE7;color:#15803D;} .delta.up::before{background:#22C55E;}
.delta.down{background:#FFE4E6;color:#BE123C;} .delta.down::before{background:#F43F5E;}
.chart-tip{position:absolute;transform:translateX(-50%);padding:12px 22px;border-radius:16px;background:rgba(255,255,255,.97);box-shadow:0 12px 32px -10px rgba(15,23,42,.14);border:1px solid rgba(241,245,249,.95);text-align:center;pointer-events:none;white-space:nowrap;transition:left .25s cubic-bezier(.16,1,.3,1),top .25s cubic-bezier(.16,1,.3,1);}
.xlabels{position:relative;height:20px;font-size:12.5px;color:#94A3B8;margin-top:10px;direction:ltr;}
.xlabels span{position:absolute;top:0;transform:translateX(-50%);cursor:pointer;white-space:nowrap;}
.xlabels span.on{color:#2563EB;font-weight:700;text-decoration:underline;text-underline-offset:4px;}
.link-blue{display:inline-flex;align-items:center;gap:4px;color:#2563EB;font-weight:700;font-size:13.5px;}
.link-blue svg{width:15px;height:15px;}
.legend-row{display:grid;grid-template-columns:1fr auto 46px;align-items:center;gap:12px;font-size:14px;color:#475569;}
.legend-row.two{grid-template-columns:1fr auto;}
.legend-dot{width:10px;height:10px;border-radius:99px;display:inline-block;margin-inline-end:12px;flex-shrink:0;}
.legend-arrow{width:12px;height:12px;stroke-width:2.6;}
.mini-stat{padding:16px 22px;border-radius:20px;background:rgba(255,255,255,.88);box-shadow:0 12px 30px -12px rgba(15,23,42,.12),inset 0 1px 1px #fff;border:1px solid rgba(255,255,255,.95);min-width:180px;}
.bars{display:flex;align-items:flex-end;justify-content:space-around;height:200px;padding:0 8px;}
.bar-group{display:flex;align-items:flex-end;gap:9px;height:100%;cursor:default;}
.bar{width:11px;border-radius:99px;transition:height .5s cubic-bezier(.16,1,.3,1);}
.bar-group:hover .bar{filter:brightness(1.08);}

/* =====================================================================
   AI FINANCIAL & TAX INTELLIGENCE — matched to reference image 4/5
   ===================================================================== */
.ai-shell{border-radius:32px;padding:34px 36px 36px;}
.ai-shell:hover{transform:none;}
.ai-logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,#1E3A8A 0%,#2563EB 100%);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 10px 22px -6px rgba(37,99,235,.5),inset 0 1px 1px rgba(255,255,255,.35);}
.ai-logo svg{width:24px;height:24px;stroke-width:1.8;}
.ai-title{font-size:22px;font-weight:700;letter-spacing:-.03em;color:#0F172A;}
.ai-sub{font-size:14px;color:#64748B;margin-top:4px;}
.grounded-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:#EFF6FF;border:1px solid #DBEAFE;color:#2563EB;font-family:var(--font-mono);font-size:11.5px;font-weight:600;}
.grounded-pill svg{width:13px;height:13px;}
.model-pill{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 8px 22px -8px rgba(15,23,42,.10),inset 0 1px 1px #fff;border:1px solid rgba(255,255,255,.95);font-family:var(--font-mono);font-size:13px;color:#475569;}
.model-pill .live{width:9px;height:9px;border-radius:99px;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.15);}
.preset-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px;}
@media(max-width:1180px){.preset-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.preset-grid{grid-template-columns:1fr;}}
.preset2{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:20px 22px 22px;border-radius:20px;text-align:start;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.95);box-shadow:0 12px 30px -14px rgba(15,23,42,.12),inset 0 1px 1px #fff;transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s;}
.preset2:hover{transform:translateY(-2px);box-shadow:0 18px 38px -14px rgba(15,23,42,.16),inset 0 1px 1px #fff;}
.preset2 .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#2563EB;padding-inline-end:24px;}
.preset2 .ptitle{font-size:14.5px;font-weight:600;color:#0F172A;letter-spacing:-.01em;}
.preset2 .parrow{position:absolute;top:19px;inset-inline-end:20px;color:#CBD5E1;transition:color .15s,transform .15s;}
.preset2 .parrow svg{width:15px;height:15px;}
html[dir="rtl"] .preset2 .parrow svg{transform:scaleX(-1);}
.preset2.on .parrow, .preset2:hover .parrow{color:#2563EB;}
.preset2:hover .parrow{transform:translateX(2px);}
.ask-bar{display:flex;align-items:center;gap:12px;margin-top:18px;padding:7px 7px 7px 24px;border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 12px 30px -14px rgba(15,23,42,.12),inset 0 1px 1px #fff;border:1px solid rgba(255,255,255,.95);}
html[dir="rtl"] .ask-bar{padding:7px 24px 7px 7px;}
.ask-bar input{flex:1;min-width:0;border:none;background:transparent;font-size:14px;color:#0F172A;padding:11px 0;}
.ask-bar input:focus{outline:none;} .ask-bar input::placeholder{color:#94A3B8;}
.btn-analyze{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:14px;background:linear-gradient(135deg,#162A45,#1E3A5F);color:#fff;font-weight:700;font-size:14.5px;border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 20px -6px rgba(22,42,69,.45),inset 0 1px 1px rgba(255,255,255,.25);flex-shrink:0;}
.btn-analyze:hover{background:linear-gradient(135deg,#1E3A5F,#26487A);}
.btn-analyze svg{width:17px;height:17px;}
.report{margin-top:26px;border-radius:26px;padding:26px 36px 34px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.95);box-shadow:0 12px 32px -16px rgba(15,23,42,.10),inset 0 1px 1px #fff;}
.report-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:20px;border-bottom:1px solid #E6ECF3;}
.report-head .rt{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:600;color:#0F172A;}
.report-head .rt::before{content:'';width:10px;height:10px;border-radius:99px;background:#2563EB;}
.copy-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:#F1F5F9;color:#334155;font-size:14px;font-weight:500;transition:.15s;}
.copy-btn:hover{background:#E2E8F0;}
.icon-btn{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#94A3B8;}
.icon-btn:hover{color:#2563EB;background:#F1F5F9;}
.icon-btn svg{width:18px;height:18px;}
.spin{animation:spin 1s linear infinite;} @keyframes spin{to{transform:rotate(360deg);}}
.report-body h3{display:flex;align-items:center;gap:14px;font-size:18px;font-weight:600;letter-spacing:-.02em;color:#0F172A;margin:30px 0 14px;}
.report-body h3::before{content:'';width:6px;height:20px;border-radius:99px;background:#2563EB;flex-shrink:0;}
.report-body li{position:relative;padding-inline-start:22px;font-size:14px;line-height:1.55;color:#334155;margin:11px 0;}
.report-body li::before{content:'';position:absolute;inset-inline-start:4px;top:.62em;width:5px;height:5px;border-radius:99px;background:#2563EB;}
.report-body li.sec{font-weight:700;color:#0F172A;margin-top:16px;}
.report-body strong{color:#0F172A;font-weight:700;}
.skeleton{height:13px;border-radius:8px;margin:14px 0;background:linear-gradient(90deg,#EEF2F7 0%,#F8FAFC 50%,#EEF2F7 100%);background-size:200% 100%;animation:shimmer 1.2s infinite;}
@keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}


@media(max-width:640px){
  .header{padding:10px 12px;gap:8px;}
  .currency-pill, #notifBell{display:none;}
  .ask-ph > span, .ask-trigger .kbd, .ask-tile[data-act="attach"], .ask-tile[data-act="plus"]{display:none;}
  .ask-trigger{padding:4px 4px 4px 12px;}
  .btn-cta span{display:none;} .btn-cta{padding:9px;}
  .dcard{padding:24px 20px;} .kpi2{padding:24px 22px;}
  .bar-group{gap:4px;} .bar{width:8px;}
  .ai-shell{padding:22px 18px;} .report{padding:20px 18px 24px;}
  .ask-bar{flex-wrap:wrap;padding:8px 8px 8px 16px;}
}
.bg-scene{overflow:hidden;}
body{overflow-x:hidden;}

/* =====================================================================
   SIDEBAR DRAWER — collapsible rail on desktop, slide-in drawer on mobile
   ===================================================================== */
.sidebar{transition:width .45s cubic-bezier(.16,1,.3,1);}
.brand-text, .nav-item .nav-left > span, .nav-badge, .nav-soon, .nav-label, .sidebar-footer{
  white-space:nowrap;transition:opacity .28s ease, transform .4s cubic-bezier(.16,1,.3,1);}
.nav-item{transition:padding .45s cubic-bezier(.16,1,.3,1), background .2s, box-shadow .2s, border-color .2s;}
.brand{transition:padding .45s cubic-bezier(.16,1,.3,1);}
@media(min-width:1025px){
  .app-shell.collapsed .sidebar{width:84px;}
  .app-shell.collapsed .brand{padding:24px 22px;}
  .app-shell.collapsed .brand-text,
  .app-shell.collapsed .nav-item .nav-left > span,
  .app-shell.collapsed .nav-badge,
  .app-shell.collapsed .nav-soon,
  .app-shell.collapsed .nav-label,
  .app-shell.collapsed .sidebar-footer{opacity:0;transform:translateX(-8px);pointer-events:none;}
  html[dir="rtl"] .app-shell.collapsed .brand-text, html[dir="rtl"] .app-shell.collapsed .nav-item .nav-left > span{transform:translateX(8px);}
  .app-shell.collapsed .nav-item{padding:12px 19px;}
}
/* animated hamburger */
.menu-btn{color:#334155;}
.burger{position:relative;width:18px;height:14px;display:block;}
.burger i{position:absolute;inset-inline-start:0;height:2px;border-radius:2px;background:currentColor;
  transition:top .4s cubic-bezier(.16,1,.3,1), transform .4s cubic-bezier(.16,1,.3,1), width .4s cubic-bezier(.16,1,.3,1), opacity .2s;}
.burger i:nth-child(1){top:0;width:18px;}
.burger i:nth-child(2){top:6px;width:12px;}
.burger i:nth-child(3){top:12px;width:18px;}
.menu-btn:hover .burger i:nth-child(2){width:18px;}
.app-shell.collapsed .burger i:nth-child(1){width:12px;}
.app-shell.collapsed .burger i:nth-child(2){width:18px;}
.app-shell.collapsed .burger i:nth-child(3){width:8px;}
.app-shell.menu-open .burger i:nth-child(1){top:6px;width:18px;transform:rotate(45deg);}
.app-shell.menu-open .burger i:nth-child(2){opacity:0;transform:translateX(-6px);}
.app-shell.menu-open .burger i:nth-child(3){top:6px;width:18px;transform:rotate(-45deg);}
@media(max-width:1024px){
  .sidebar{transition:transform .5s cubic-bezier(.16,1,.3,1), box-shadow .5s;box-shadow:none;}
  .sidebar.open{box-shadow:0 30px 80px -10px rgba(15,23,42,.35);}
  .sidebar-backdrop{display:block !important;opacity:0;visibility:hidden;transition:opacity .4s ease, visibility .4s;}
  .sidebar-backdrop.open{opacity:1;visibility:visible;}
  .sidebar.open .nav-item{animation:navIn .55s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 40ms + 90ms);}
  .sidebar.open .sidebar-footer{animation:navIn .55s cubic-bezier(.16,1,.3,1) .45s both;}
  #closeMobileNav{display:flex !important;}
}
@keyframes navIn{from{opacity:0;transform:translateX(-18px);}to{opacity:1;transform:none;}}
html[dir="rtl"] .sidebar.open .nav-item{animation-name:navInRtl;}
@keyframes navInRtl{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:none;}}

/* =====================================================================
   "ASK ANYTHING" SEARCH — gradient glow border (matched to reference)
   ===================================================================== */
.ask-wrap{position:relative;flex:1;max-width:540px;min-width:0;}
.ask-glow{position:absolute;border-radius:50%;pointer-events:none;filter:blur(18px);opacity:.4;transition:opacity .3s;}
.ask-glow.peach{width:140px;height:44px;left:6%;top:-8px;background:radial-gradient(closest-side,rgba(244,170,140,.55),transparent);}
.ask-glow.blue{width:200px;height:40px;right:12%;bottom:-12px;background:radial-gradient(closest-side,rgba(92,118,255,.45),transparent);}
.ask-wrap:hover .ask-glow{opacity:.6;}
.ask-trigger{position:relative;z-index:1;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 6px 6px 16px;border-radius:15px;
  border:1px solid transparent;
  background:linear-gradient(#F5F5F6,#F5F5F6) padding-box,
             linear-gradient(90deg,#93A4F6 0%,#E8C5BA 15%,#EFD7CE 50%,#E8C5BA 85%,#93A4F6 100%) border-box;
  box-shadow:0 4px 10px -8px rgba(79,105,255,.35),0 1px 2px rgba(15,23,42,.03),inset 0 1px 0 #fff;
  transition:box-shadow .3s cubic-bezier(.16,1,.3,1), transform .3s cubic-bezier(.16,1,.3,1);}
html[dir="rtl"] .ask-trigger{padding:5px 16px 5px 5px;}
.ask-trigger:hover{box-shadow:0 6px 14px -8px rgba(79,105,255,.45),0 1px 2px rgba(15,23,42,.04),inset 0 1px 0 #fff;transform:translateY(-1px);}
.ask-ph{display:flex;align-items:center;gap:10px;color:#6B7280;font-size:14px;min-width:0;}
.ask-ph span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ask-ph svg{width:16px;height:16px;color:#9CA3AF;}
.ask-tools{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ask-tools .kbd{margin-inline-end:4px;background:#EDEDF0;border-color:#E4E4E8;}
.ask-tile{width:32px;height:32px;border-radius:9px;background:#FBFBFB;display:flex;align-items:center;justify-content:center;color:#111827;
  box-shadow:0 1px 2px rgba(15,23,42,.05),0 2px 5px -3px rgba(15,23,42,.08),inset 0 1px 0 #fff;transition:transform .15s;}
.ask-tile:hover{transform:translateY(-1px);}
.ask-tile svg{width:15px;height:15px;stroke-width:1.9;}

/* Full composer (opens from the search) */
#cmdkModal{align-items:flex-start;padding-top:15vh;}
#cmdkModal .modal-backdrop{background:rgba(236,237,240,.6);backdrop-filter:blur(12px) saturate(120%);-webkit-backdrop-filter:blur(12px) saturate(120%);animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.cmdk-shell{position:relative;z-index:2;width:100%;max-width:780px;animation:composerIn .5s cubic-bezier(.16,1,.3,1);}
@keyframes composerIn{from{opacity:0;transform:translateY(-16px) scale(.97);}to{opacity:1;transform:none;}}
.composer-glow{position:absolute;border-radius:50%;pointer-events:none;z-index:-1;filter:blur(40px);opacity:.7;animation:glowIn 1s ease both;}
.composer-glow.peach{width:380px;height:300px;left:-30px;top:-150px;background:radial-gradient(closest-side,rgba(244,168,138,.5),rgba(244,168,138,0));}
.composer-glow.blue{width:460px;height:320px;right:0;top:-40px;background:radial-gradient(closest-side,rgba(92,118,255,.42),rgba(92,118,255,0));}
@keyframes glowIn{from{opacity:0;transform:scale(.85);}to{opacity:.7;transform:none;}}
.composer{position:relative;border-radius:19px;border:1.5px solid transparent;padding:14px 10px 10px 16px;
  background:linear-gradient(#F5F5F5,#F5F5F5) padding-box,
             linear-gradient(90deg,#93A4F6 0%,#E8C5BA 14%,#EFD7CE 50%,#E8C5BA 86%,#93A4F6 100%) border-box;
  box-shadow:0 8px 18px -12px rgba(79,105,255,.35),0 1px 3px rgba(15,23,42,.04),inset 0 1px 0 #fff;
  transition:box-shadow .35s cubic-bezier(.16,1,.3,1);}
html[dir="rtl"] .composer{padding:14px 16px 10px 10px;}
.composer:focus-within{box-shadow:0 10px 22px -12px rgba(79,105,255,.45),0 0 0 3px rgba(147,164,246,.10),inset 0 1px 0 #fff;}
.composer textarea{display:block;width:100%;border:none;background:transparent;resize:none;font-size:19px;line-height:1.4;color:#1F2937;padding:0 2px 14px;max-height:140px;}
.composer textarea:focus{outline:none;}
.composer textarea::placeholder{color:#5F6670;}
.composer-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.composer-hint{font-size:11px;color:#9CA3AF;font-family:var(--font-mono);}
.ctile{width:46px;height:46px;border-radius:11px;background:#FAFAFA;display:flex;align-items:center;justify-content:center;color:#111827;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 1px 2px rgba(15,23,42,.05),0 3px 7px -4px rgba(15,23,42,.10),inset 0 1px 0 #fff;
  transition:transform .18s cubic-bezier(.16,1,.3,1), box-shadow .18s, background .18s, color .18s;}
.ctile:hover{transform:translateY(-1px);box-shadow:0 1px 3px rgba(15,23,42,.06),0 5px 10px -6px rgba(15,23,42,.14),inset 0 1px 0 #fff;}
.ctile:active{transform:scale(.96);}
.ctile svg{width:19px;height:19px;stroke-width:1.9;}
.ctile.on{background:#EEF2FF;color:#4338CA;}
.ctile.on svg{transform:rotate(45deg);transition:transform .3s cubic-bezier(.16,1,.3,1);}
.ctile svg{transition:transform .3s cubic-bezier(.16,1,.3,1);}
.wave-svg .wv{transform-box:fill-box;transform-origin:center;}
.ctile.listening{background:#EEF2FF;color:#4F46E5;box-shadow:0 0 0 4px rgba(99,102,241,.15),0 5px 12px -5px rgba(79,70,229,.4);}
.ctile.listening .wv{animation:wv .8s ease-in-out infinite;}
@keyframes wv{0%,100%{transform:scaleY(.35);}50%{transform:scaleY(1);}}
.attach-chip{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:5px 8px 5px 10px;border-radius:9px;background:#fff;font-size:12px;color:#334155;box-shadow:0 1px 3px rgba(15,23,42,.08);}
.attach-chip svg{width:13px;height:13px;color:#6366F1;}
.attach-chip button{display:flex;color:#94A3B8;} .attach-chip button:hover{color:#E11D48;}
.cmdk-results{margin-top:16px;border-radius:20px;max-height:44vh;overflow-y:auto;padding:8px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(255,255,255,.95);box-shadow:0 20px 50px -20px rgba(15,23,42,.18),inset 0 1px 0 #fff;
  animation:composerIn .55s .06s cubic-bezier(.16,1,.3,1) both;}
.cmdk-results:empty{display:none;}
.cmdk-results .nav-label{padding:10px 12px 6px;}
.cmdk-item{cursor:pointer;transition:background .15s, color .15s;}
.cmdk-sub{font-size:11px;color:#94A3B8;font-family:var(--font-mono);flex-shrink:0;}
.cmdk-item.sel .cmdk-sub{color:#6366F1;}
.ask-ai-ic{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff;flex-shrink:0;}
.ask-ai-ic svg{width:12px !important;height:12px !important;color:#fff !important;}
@media(max-width:640px){
  #cmdkModal{padding-top:8vh;}
  .composer-hint{display:none;}
  .composer textarea{font-size:17px;}
}

/* =====================================================================
   SEARCH — glass morphism + motion
   ===================================================================== */
@property --ring{syntax:'<angle>';initial-value:0deg;inherits:false;}
.ask-wrap .ask-trigger, .cmdk-shell .composer{
  border:none;isolation:isolate;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.74) 0%,rgba(255,255,255,.46) 55%,rgba(246,248,255,.6) 100%);
  backdrop-filter:blur(22px) saturate(185%);-webkit-backdrop-filter:blur(22px) saturate(185%);}
.ask-wrap .ask-trigger{padding:7px 7px 7px 17px;}
html[dir="rtl"] .ask-wrap .ask-trigger{padding:7px 17px 7px 7px;}
.cmdk-shell .composer{padding:16px 12px 12px 18px;}
/* rotating gradient ring (hairline) */
.ask-wrap .ask-trigger::before, .cmdk-shell .composer::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:conic-gradient(from var(--ring),#93A4F6 0deg,#E8C5BA 70deg,#F6DCD2 140deg,#C7B9F6 220deg,#9FB4FF 290deg,#93A4F6 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:ringSpin 7s linear infinite;}
.cmdk-shell .composer::before{padding:1.5px;}
@keyframes ringSpin{to{--ring:360deg;}}
.ask-wrap .ask-trigger:hover::before{animation-duration:3s;}
.cmdk-shell .composer:focus-within::before{animation-duration:3.5s;}
/* top glass highlight */
.cmdk-shell .composer{box-shadow:0 8px 18px -12px rgba(79,105,255,.3),0 1px 3px rgba(15,23,42,.04),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.4);}
/* light sweep */
.ask-wrap .ask-trigger::after, .cmdk-shell .composer::after{
  content:'';position:absolute;top:0;bottom:0;left:-60%;width:38%;pointer-events:none;z-index:1;
  background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.75) 50%,transparent 100%);transform:skewX(-18deg);opacity:0;}
.ask-wrap .ask-trigger:hover::after{animation:sheen 1.1s cubic-bezier(.16,1,.3,1);}
.cmdk-shell .composer::after{animation:sheen 1.3s .25s cubic-bezier(.16,1,.3,1);}
@keyframes sheen{0%{left:-60%;opacity:1;}100%{left:130%;opacity:1;}}
.ask-ph, .ask-tools, .composer > *:not(input){position:relative;z-index:3;}
/* glass tiles */
.ask-wrap .ask-tile, .cmdk-shell .ctile{
  background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.62));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 1px 2px rgba(15,23,42,.05),0 3px 8px -5px rgba(79,105,255,.25),inset 0 1px 0 #fff;}
.ask-wrap .ask-tools .kbd{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.9);}
.cmdk-shell .ctile.on, .cmdk-shell .ctile.listening{background:linear-gradient(145deg,#EEF2FF,#E0E7FF);}
/* drifting ambient glows */
.ask-glow.peach{animation:driftA 7s ease-in-out infinite alternate;}
.ask-glow.blue{animation:driftB 8s ease-in-out infinite alternate;}
.composer-glow.peach{animation:glowIn 1s ease both, driftA 9s ease-in-out 1s infinite alternate;}
.composer-glow.blue{animation:glowIn 1s ease both, driftB 10s ease-in-out 1s infinite alternate;}
@keyframes driftA{from{transform:translate(0,0) scale(1);}to{transform:translate(34px,6px) scale(1.12);}}
@keyframes driftB{from{transform:translate(0,0) scale(1);}to{transform:translate(-40px,-4px) scale(1.1);}}
/* cycling placeholder */
#askPh{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;transition:opacity .25s ease,transform .25s ease;}
.ask-wrap{flex:none;width:clamp(300px,36vw,540px);}
@media(max-width:640px){.ask-wrap{flex:1;width:auto;min-width:0;}}
.header{gap:12px;}
.header > div:first-child{flex:1;min-width:0;}
.header > div:last-child{flex-shrink:0;}
#askPh.out{opacity:0;transform:translateY(-7px);}
#askPh.in{animation:phIn .45s cubic-bezier(.16,1,.3,1);}
@keyframes phIn{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
/* results panel: glass */
.cmdk-results{background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.58));backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);}
.cmdk-results .cmdk-item{animation:itemIn .4s cubic-bezier(.16,1,.3,1) both;}
@keyframes itemIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){
  .ask-wrap .ask-trigger::before, .cmdk-shell .composer::before, .ask-glow, .composer-glow, .cmdk-shell .composer::after, .cmdk-results .cmdk-item{animation:none !important;}
}

/* ---------- Search: full pill (radius 999) ---------- */
.ask-wrap .ask-trigger{border-radius:999px;padding:6px 6px 6px 20px;}
html[dir="rtl"] .ask-wrap .ask-trigger{padding:6px 20px 6px 6px;}
.ask-wrap .ask-tile{border-radius:999px;}
.ask-wrap .ask-tools .kbd{border-radius:999px;padding:3px 10px;}
.cmdk-shell .composer{border-radius:30px;padding:18px 14px 14px 22px;}
html[dir="rtl"] .cmdk-shell .composer{padding:18px 22px 14px 14px;}
.cmdk-shell .ctile{border-radius:999px;}
.cmdk-results{border-radius:26px;}

/* =====================================================================
   GLASS MORPHISM v2 — every card is translucent frosted glass
   ===================================================================== */
:root{
  --glass-fill:linear-gradient(135deg,rgba(255,255,255,.60) 0%,rgba(255,255,255,.36) 55%,rgba(255,255,255,.46) 100%);
  --glass-blur:blur(26px) saturate(185%);
  --glass-edge:linear-gradient(140deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.35) 28%,rgba(255,255,255,.06) 55%,rgba(255,255,255,.25) 78%,rgba(255,255,255,.85) 100%);
  --glass-shadow:inset 0 1px 1px rgba(255,255,255,.75),inset 0 -1px 1px rgba(255,255,255,.2),0 14px 34px -16px rgba(30,41,82,.16),0 2px 6px -2px rgba(30,41,82,.05);
}
.glass-card, .glass-card-subtle, .mini-stat, .preset2, .report, .ask-bar,
.glass-kpi-blue, .glass-kpi-cyan, .glass-kpi-peach{position:relative;}
.glass-card{
  background:var(--glass-fill);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid rgba(255,255,255,.35);
  box-shadow:var(--glass-shadow);}
.glass-card:hover{
  border-color:rgba(255,255,255,.55);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.85),inset 0 -1px 1px rgba(255,255,255,.25),0 22px 44px -18px rgba(30,41,82,.22),0 3px 8px -3px rgba(30,41,82,.06);}
.ai-shell:hover{box-shadow:var(--glass-shadow);}
/* light-catching gradient edge on every card */
.glass-card::before, .glass-card-subtle::before, .mini-stat::before, .preset2::before, .report::before, .ask-bar::before,
.glass-kpi-blue::before, .glass-kpi-cyan::before, .glass-kpi-peach::before, .glass-modal::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:var(--glass-edge);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);}
.glass-modal{position:relative;}
.modal-overlay .glass-modal{position:relative;}
.toast.glass-modal{position:relative;}
/* tinted glass KPI cards */
.glass-kpi-blue{background:linear-gradient(145deg,rgba(214,230,255,.62) 0%,rgba(226,238,255,.32) 55%,rgba(236,244,255,.48) 100%);border:1px solid rgba(255,255,255,.35);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 14px 34px -16px rgba(37,99,235,.20),0 2px 6px -2px rgba(37,99,235,.05);}
.glass-kpi-cyan{background:linear-gradient(145deg,rgba(204,247,254,.62) 0%,rgba(222,249,253,.32) 55%,rgba(234,252,254,.48) 100%);border:1px solid rgba(255,255,255,.35);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 14px 34px -16px rgba(6,182,212,.20),0 2px 6px -2px rgba(6,182,212,.05);}
.glass-kpi-peach{background:linear-gradient(145deg,rgba(255,224,204,.62) 0%,rgba(255,235,222,.32) 55%,rgba(255,244,236,.5) 100%);border:1px solid rgba(255,255,255,.4);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 14px 34px -16px rgba(249,115,22,.20),0 2px 6px -2px rgba(249,115,22,.05);}
.glass-kpi-blue, .glass-kpi-cyan, .glass-kpi-peach{backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);}
/* inner glass surfaces */
.glass-card-subtle{background:linear-gradient(135deg,rgba(255,255,255,.52),rgba(255,255,255,.28));backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 6px 18px -10px rgba(30,41,82,.12);}
.mini-stat, .preset2, .ask-bar{background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.34));backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 10px 26px -14px rgba(30,41,82,.16);}
.preset2:hover{box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 18px 36px -16px rgba(30,41,82,.22);}
.report{background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.26));backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.75),0 10px 28px -16px rgba(30,41,82,.12);}
.report-head{border-bottom-color:rgba(148,163,184,.22);}
.seg, .more-btn, .model-pill, .glass-pill{background:rgba(255,255,255,.5);backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1px 1px rgba(255,255,255,.85),0 4px 12px -6px rgba(30,41,82,.12);}
.more-btn.ghost{background:none;border:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;}
.chart-tip{background:rgba(255,255,255,.62);backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);border:1px solid rgba(255,255,255,.75);}
.copy-btn{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);}
/* shell */
.glass-drawer{background:linear-gradient(180deg,rgba(255,255,255,.58) 0%,rgba(255,255,255,.40) 50%,rgba(255,255,255,.5) 100%);backdrop-filter:blur(28px) saturate(185%);-webkit-backdrop-filter:blur(28px) saturate(185%);border-right:1px solid rgba(255,255,255,.55);}
.header{background:rgba(255,255,255,.28);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.5);}
/* modal glass (kept a touch more opaque for readability) */
.glass-modal{background:linear-gradient(155deg,rgba(255,255,255,.80) 0%,rgba(255,255,255,.66) 55%,rgba(255,255,255,.74) 100%);border:1px solid rgba(255,255,255,.5);}
/* tables & fields inside glass */
th{background:rgba(255,255,255,.34);border-bottom-color:rgba(148,163,184,.25);}
td{border-bottom-color:rgba(148,163,184,.16);}
tr.row-hover:hover td{background:rgba(255,255,255,.45);}
.field input, .field select, .field textarea{background:rgba(255,255,255,.62);border-color:rgba(148,163,184,.4);backdrop-filter:blur(8px);}
.divider{background:rgba(148,163,184,.2);}

/* ---------- Language toggle (EN | عربي) ---------- */
.lang-toggle{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:999px;cursor:pointer;user-select:none;}
.lang-globe{display:flex;color:#64748B;}
.lang-globe svg{width:15px;height:15px;transition:transform .6s cubic-bezier(.16,1,.3,1);}
.lang-toggle.is-ar .lang-globe svg{transform:rotate(180deg);}
.lang-track{position:relative;display:grid;grid-template-columns:1fr 1fr;border-radius:999px;background:rgba(148,163,184,.12);padding:2px;}
.lang-track button{position:relative;z-index:1;min-width:44px;padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700;color:#64748B;transition:color .3s ease;line-height:1.2;}
.lang-track button.ar{font-family:var(--font-arabic);font-size:12.5px;font-weight:600;}
.lang-toggle.is-en .lang-track button[data-lang="en"], .lang-toggle.is-ar .lang-track button[data-lang="ar"]{color:#fff;}
.lang-track button:hover{color:#0F172A;}
.lang-toggle.is-en .lang-track button[data-lang="en"]:hover, .lang-toggle.is-ar .lang-track button[data-lang="ar"]:hover{color:#fff;}
.lang-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:999px;
  background:linear-gradient(135deg,#162A45,#1E3A5F);box-shadow:0 4px 10px -3px rgba(22,42,69,.45),inset 0 1px 1px rgba(255,255,255,.3);
  transition:transform .42s cubic-bezier(.16,1,.3,1);}
.lang-toggle.is-ar .lang-thumb{transform:translateX(100%);}
.lang-toggle:has(:focus-visible){box-shadow:0 0 0 3px rgba(37,99,235,.22);}
.chart-tip{direction:ltr;}
/* page cross-fade when direction flips */
.page-container, .sidebar-inner, .header > div{transition:opacity .26s ease, transform .26s ease, filter .26s ease;}
body.lang-out .page-container, body.lang-out .sidebar-inner{opacity:0;filter:blur(4px);transform:translateY(4px);}
body.lang-in .page-container, body.lang-in .sidebar-inner{animation:langIn .42s cubic-bezier(.16,1,.3,1);}
@keyframes langIn{from{opacity:0;filter:blur(4px);transform:translateY(-4px);}to{opacity:1;filter:none;transform:none;}}
@media(max-width:640px){ .lang-globe{display:none;} .lang-toggle{padding:3px;} .lang-track button{min-width:36px;padding:5px 8px;} }
@media (prefers-reduced-motion:reduce){ .lang-thumb, .lang-globe svg{transition:none;} body.lang-in .page-container, body.lang-in .sidebar-inner{animation:none;} }

/* =====================================================================
   DESIGN SYSTEM — tokens (single source of truth) + component wiring
   Every component below reads these variables; the Design System page
   reads the same variables at runtime to document them.
   ===================================================================== */
:root{
  /* Colour — brand */
  --color-brand:#162A45; --color-brand-2:#1E3A5F;
  --color-primary:#2563EB; --color-primary-hover:#1D4ED8; --color-primary-soft:#EFF6FF;
  /* Colour — accent (data & KPI emphasis) */
  --color-accent-cyan:#0EA5E9; --color-accent-orange:#F97316; --color-accent-purple:#8B5CF6;
  /* Colour — neutral */
  --color-ink:#0F172A; --color-text:#334155; --color-text-muted:#64748B; --color-text-subtle:#94A3B8;
  --color-border:#E2E8F0; --color-border-strong:#CBD5E1; --color-surface:#FFFFFF; --color-surface-muted:#F8FAFC;
  /* Colour — semantic */
  --color-success:#059669; --color-success-bg:#ECFDF5; --color-success-border:#A7F3D0;
  --color-info:#2563EB;    --color-info-bg:#EFF6FF;    --color-info-border:#BFDBFE;
  --color-warning:#D97706; --color-warning-bg:#FFFBEB; --color-warning-border:#FDE68A;
  --color-danger:#E11D48;  --color-danger-bg:#FFF1F2;  --color-danger-border:#FECDD3;
  /* Typography */
  --fs-xs:11px; --fs-sm:12.5px; --fs-base:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:32px;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700; --fw-extrabold:800;
  --lh-tight:1.2; --lh-normal:1.45; --lh-relaxed:1.65;
  /* Spacing (4px base) */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-12:48px;
  /* Corner radius */
  --radius-xs:6px; --radius-sm:9px; --radius-md:14px; --radius-lg:20px; --radius-xl:28px; --radius-full:999px;
  /* Elevation */
  --elev-0:none;
  --elev-1:0 1px 2px rgba(15,23,42,.06);
  --elev-2:0 4px 12px -4px rgba(15,23,42,.12);
  --elev-3:0 14px 34px -16px rgba(30,41,82,.18), 0 2px 6px -2px rgba(30,41,82,.05);
  --elev-4:0 24px 60px -12px rgba(15,23,42,.22), 0 8px 24px -6px rgba(15,23,42,.06);
  /* Motion */
  --dur-fast:150ms; --dur-base:250ms; --ease-out:cubic-bezier(.16,1,.3,1);
  /* Focus */
  --focus-ring:0 0 0 3px rgba(37,99,235,.22);
}

/* ---- Buttons ---- */
.btn{border-radius:var(--radius-md);font-weight:var(--fw-semibold);gap:var(--space-2);transition:background var(--dur-fast),box-shadow var(--dur-fast),transform var(--dur-fast),color var(--dur-fast);}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring);}
.btn-sm{font-size:var(--fs-xs);padding:7px var(--space-3);}
.btn-md{font-size:var(--fs-sm);padding:9px var(--space-4);}
.btn-lg{font-size:var(--fs-base);padding:11px var(--space-6);}
.btn-primary{background:var(--color-brand);box-shadow:var(--elev-1);}
.btn-primary:hover{background:var(--color-brand-2);}
.btn-accent{background:var(--color-primary);color:#fff;box-shadow:var(--elev-1);}
.btn-accent:hover{background:var(--color-primary-hover);}
.btn-outline{background:var(--color-surface);color:var(--color-text);border-color:var(--color-border);}
.btn-outline:hover{background:var(--color-surface-muted);}
.btn-destructive{background:var(--color-danger);}
.btn-ghost{color:var(--color-text-muted);}
.btn-icon{padding:0;width:36px;height:36px;border-radius:var(--radius-full);}
.btn-icon.btn-sm{width:30px;height:30px;}
.btn .spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;}
.btn[aria-busy="true"]{pointer-events:none;opacity:.85;}

/* ---- Inputs ---- */
.field label{font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--color-text);}
.field input, .field select, .field textarea{border-radius:var(--radius-sm);font-size:var(--fs-sm);padding:9px var(--space-3);color:var(--color-ink);transition:border-color var(--dur-fast),box-shadow var(--dur-fast);}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--color-primary);box-shadow:var(--focus-ring);}
.field .help{font-size:var(--fs-xs);color:var(--color-text-muted);}
.field .err{font-size:var(--fs-xs);color:var(--color-danger);}
.field.has-error input, .field.has-error select, .field.has-error textarea{border-color:var(--color-danger);box-shadow:0 0 0 3px rgba(225,29,72,.12);}
.field input:disabled, .field select:disabled, .field textarea:disabled{background:var(--color-surface-muted);color:var(--color-text-subtle);cursor:not-allowed;}
.input-group{display:flex;align-items:stretch;}
.input-group .addon{display:flex;align-items:center;padding:0 var(--space-3);font-size:var(--fs-xs);font-weight:var(--fw-bold);color:var(--color-text-muted);background:var(--color-surface-muted);border:1px solid rgba(148,163,184,.4);border-inline-end:none;border-radius:var(--radius-sm) 0 0 var(--radius-sm);font-family:var(--font-mono);}
html[dir="rtl"] .input-group .addon{border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
.input-group input{border-start-start-radius:0 !important;border-end-start-radius:0 !important;}

/* ---- Custom dropdown ---- */
.dd{position:relative;display:inline-block;width:100%;}
.dd-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);padding:9px var(--space-3);border-radius:var(--radius-sm);border:1px solid rgba(148,163,184,.4);background:rgba(255,255,255,.62);font-size:var(--fs-sm);color:var(--color-ink);transition:border-color var(--dur-fast),box-shadow var(--dur-fast);}
.dd-trigger:focus-visible, .dd.open .dd-trigger{outline:none;border-color:var(--color-primary);box-shadow:var(--focus-ring);}
.dd-trigger .chev{color:var(--color-text-subtle);transition:transform var(--dur-base) var(--ease-out);}
.dd.open .dd-trigger .chev{transform:rotate(180deg);}
.dd-menu{position:absolute;z-index:60;top:calc(100% + 6px);inset-inline-start:0;min-width:100%;padding:var(--space-1);border-radius:var(--radius-md);
  background:rgba(255,255,255,.9);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.9);box-shadow:var(--elev-4);
  opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top;pointer-events:none;transition:opacity var(--dur-fast),transform var(--dur-base) var(--ease-out);}
.dd.open .dd-menu{opacity:1;transform:none;pointer-events:auto;}
.dd-opt{width:100%;display:flex;align-items:center;gap:var(--space-2);padding:8px var(--space-3);border-radius:var(--radius-sm);font-size:var(--fs-sm);color:var(--color-text);text-align:start;}
.dd-opt:hover, .dd-opt.active{background:var(--color-primary-soft);color:var(--color-primary-hover);}
.dd-opt .tick{margin-inline-start:auto;color:var(--color-primary);opacity:0;}
.dd-opt[aria-selected="true"] .tick{opacity:1;}
.dd-opt.danger{color:var(--color-danger);} .dd-opt.danger:hover, .dd-opt.danger.active{background:var(--color-danger-bg);color:var(--color-danger);}
.dd-sep{height:1px;margin:var(--space-1) 0;background:var(--color-border);}

/* ---- Status chips & badges ---- */
.chip{border-radius:var(--radius-xs);font-size:var(--fs-xs);font-weight:var(--fw-medium);padding:2px 9px;gap:6px;}
.chip-success{background:var(--color-success-bg);border-color:var(--color-success-border);color:#065F46;} .chip-success .dot{background:var(--color-success);}
.chip-info{background:var(--color-info-bg);border-color:var(--color-info-border);color:#1E40AF;} .chip-info .dot{background:var(--color-info);}
.chip-warning{background:var(--color-warning-bg);border-color:var(--color-warning-border);color:#92400E;} .chip-warning .dot{background:var(--color-warning);}
.chip-danger{background:var(--color-danger-bg);border-color:var(--color-danger-border);color:#9F1239;} .chip-danger .dot{background:var(--color-danger);}
.chip-neutral{background:#F1F5F9;border-color:var(--color-border);color:var(--color-text);} .chip-neutral .dot{background:var(--color-text-subtle);}

/* ---- Data table ---- */
th{font-size:10.5px;font-weight:var(--fw-bold);color:var(--color-text);padding:10px var(--space-3);}
td{font-size:var(--fs-xs);padding:10px var(--space-3);color:var(--color-ink);}

/* ---- Modal & toast ---- */
.modal-box{border-radius:var(--radius-xl);box-shadow:var(--elev-4);}
.toast{border-radius:var(--radius-lg);box-shadow:var(--elev-4);}
.card{border-radius:var(--radius-xl);}

/* ---- Sidebar icons: darker, higher-contrast ---- */
.nav-item{color:var(--color-text);}
.nav-item svg{color:#475569;stroke-width:2.1;}
.nav-item.glass-nav-inactive:hover svg{color:var(--color-ink);}
.nav-item.disabled{color:#94A3B8;opacity:1;}
.nav-item.disabled svg{color:#475569;}
.nav-item.disabled{color:var(--color-text-muted);}

/* ---- Design System page ---- */
.ds-nav{position:sticky;top:78px;z-index:20;display:flex;flex-wrap:wrap;gap:6px;padding:6px;border-radius:var(--radius-full);margin-bottom:var(--space-6);}
.ds-nav.glass-pill{background:rgba(255,255,255,.86);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--elev-2),inset 0 1px 1px #fff;}
.ds-nav a{padding:6px 12px;border-radius:var(--radius-full);font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--color-text-muted);transition:background var(--dur-fast),color var(--dur-fast);}
.ds-nav a:hover{background:rgba(255,255,255,.8);color:var(--color-ink);}
.ds-nav .grp{align-self:center;padding:0 6px 0 10px;font-size:10px;font-weight:var(--fw-bold);letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-subtle);}
.ds-section{scroll-margin-top:140px;margin-bottom:var(--space-6);}
.ds-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-5);}
.ds-kicker{font-size:10.5px;font-weight:var(--fw-bold);letter-spacing:.08em;text-transform:uppercase;color:var(--color-primary);}
.ds-title{font-size:var(--fs-xl);font-weight:var(--fw-bold);letter-spacing:-.02em;color:var(--color-ink);margin-top:2px;}
.ds-desc{font-size:var(--fs-sm);color:var(--color-text-muted);margin-top:4px;max-width:640px;line-height:var(--lh-relaxed);}
.ds-used{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--color-primary);padding:6px 12px;border-radius:var(--radius-full);background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);}
.ds-used:hover{background:#fff;}
.ds-used svg{width:13px;height:13px;}
.tok{font-family:var(--font-mono);font-size:10.5px;color:var(--color-text-muted);}
.tok b{color:var(--color-ink);font-weight:600;}
.swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--space-4);}
.swatch{cursor:pointer;text-align:start;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;}
.swatch .nm{margin-top:var(--space-2);}
.glass-card:has(.dd.open), .glass-kpi-blue:has(.dd.open){z-index:40;}
.swatch .chipc{height:64px;border-radius:var(--radius-md);box-shadow:var(--elev-2),inset 0 0 0 1px rgba(15,23,42,.06);transition:transform var(--dur-base) var(--ease-out);}
.swatch:hover .chipc{transform:translateY(-2px);}
.swatch .nm{font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--color-ink);margin-top:var(--space-2);}
.ds-group-label{font-size:var(--fs-xs);font-weight:var(--fw-bold);color:var(--color-text);margin:var(--space-5) 0 var(--space-3);}
.ds-group-label:first-child{margin-top:0;}
.sem-card{border-radius:var(--radius-md);padding:var(--space-4);border:1px solid;}
.type-row{display:grid;grid-template-columns:210px 1fr auto;align-items:baseline;gap:var(--space-4);padding:var(--space-3) 0;border-bottom:1px solid rgba(148,163,184,.18);}
.space-row{display:grid;grid-template-columns:90px 50px 1fr;align-items:center;gap:var(--space-3);padding:6px 0;}
.space-bar{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--color-primary),var(--color-accent-cyan));}
.radius-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--space-4);}
.radius-tile{height:84px;background:linear-gradient(135deg,rgba(37,99,235,.14),rgba(14,165,233,.10));border:1.5px solid rgba(37,99,235,.45);}
.elev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:var(--space-5);}
.elev-tile{height:96px;border-radius:var(--radius-lg);background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:var(--fs-xs);font-weight:600;color:var(--color-text);}
.spec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--space-5);}
.spec{display:flex;flex-direction:column;gap:var(--space-2);}
.spec-label{font-size:10.5px;font-weight:var(--fw-bold);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-subtle);}
.btn-matrix{display:grid;grid-template-columns:110px repeat(3,auto) 1fr;gap:var(--space-3) var(--space-4);align-items:center;}
.btn-matrix .rl{font-family:var(--font-mono);font-size:10.5px;color:var(--color-text-muted);}
.ds-section, #page-design-tokens .grid > *{min-width:0;}
.btn-matrix{overflow-x:auto;padding-bottom:4px;}
@media(max-width:640px){ .card.ds-section{padding:22px 18px;} .swatch-grid{grid-template-columns:repeat(2,1fr);} .radius-grid{grid-template-columns:repeat(2,1fr);} .space-row{grid-template-columns:80px 40px 1fr;} }
@media(max-width:900px){ .btn-matrix{grid-template-columns:1fr 1fr 1fr;} .btn-matrix .rl{grid-column:1 / -1;margin-top:6px;} .type-row{grid-template-columns:1fr;gap:4px;} .ds-nav{position:static;border-radius:var(--radius-lg);} }

/* ---------- Recent invoices (dashboard) ---------- */
.recent-table{position:relative;border-radius:var(--radius-md);border:1px solid rgba(148,163,184,.2);}
.sr-only{top:0;left:0;}
.recent-table table{border-radius:var(--radius-md);}
.recent-table thead th:first-child{border-top-left-radius:var(--radius-md);} .recent-table thead th:last-child{border-top-right-radius:var(--radius-md);}
@media(max-width:900px){ .recent-table{overflow-x:auto;} .recent-table table{min-width:760px;} }
.link-row{font:inherit;color:var(--color-primary);font-weight:600;} .link-row:hover{text-decoration:underline;text-underline-offset:3px;}
.empty-state{display:flex;flex-direction:column;align-items:center;padding:var(--space-8) var(--space-4);color:var(--color-text-subtle);text-align:center;}
.empty-state > svg{width:22px;height:22px;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.dd-up .dd-menu{top:auto;bottom:calc(100% + 6px);transform-origin:bottom;}

/* ---------- Inspect tokens mode ---------- */
.inspect-fab{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:150;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--radius-full);
  font-size:var(--fs-xs);font-weight:var(--fw-bold);color:var(--color-ink);
  background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.9);box-shadow:var(--elev-3),inset 0 1px 1px #fff;transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-base) var(--ease-out);}
html[dir="rtl"] .inspect-fab{left:50%;right:auto;}
.inspect-fab:hover{transform:translateX(-50%) translateY(-1px);}
.inspect-fab svg{width:15px;height:15px;color:var(--color-primary);}
.inspect-fab kbd{font-family:var(--font-mono);font-size:10px;padding:1px 6px;border-radius:5px;background:rgba(148,163,184,.18);color:var(--color-text-muted);}
.inspect-fab.on{background:var(--color-brand);color:#fff;border-color:rgba(255,255,255,.25);}
.inspect-fab.on svg{color:#fff;} .inspect-fab.on kbd{background:rgba(255,255,255,.18);color:#fff;}
body.inspecting, body.inspecting *{cursor:help !important;}
.insp-target{outline:1.5px dashed var(--color-primary) !important;outline-offset:3px;}
.insp-tip{position:fixed;z-index:400;min-width:250px;max-width:320px;padding:12px 14px;border-radius:var(--radius-md);pointer-events:none;
  background:rgba(15,23,42,.92);color:#E2E8F0;backdrop-filter:blur(12px);box-shadow:var(--elev-4);font-size:11px;}
.insp-name{font-size:12.5px;font-weight:700;color:#fff;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.12);}
.insp-row{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;padding:3px 0;}
.insp-row span{color:#94A3B8;} .insp-row b{font-weight:600;color:#fff;font-family:var(--font-mono);font-size:10.5px;}
.insp-row code{font-family:var(--font-mono);font-size:10px;color:#93C5FD;background:rgba(37,99,235,.22);padding:1px 6px;border-radius:5px;}
.insp-row code.off{color:#94A3B8;background:rgba(148,163,184,.15);}
@media(max-width:640px){ .inspect-fab span, .inspect-fab kbd{display:none;} .inspect-fab{padding:10px;} }

@media(max-width:900px){
  .kpi-row, .chart-row, .activity-row{grid-template-columns:1fr !important;}
}

  const s = n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
  return opts.hideSymbol ? s : 'AED ' + s;
}
function formatCompactAED(amount){
  const n = Number(amount||0);
  const abs = Math.abs(n);
  if(abs >= 1000000) return (n/1000000).toFixed(2) + 'M';
  if(abs >= 1000) return (n/1000).toFixed(1) + 'k';
  return n.toFixed(0);
}
function formatDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- SMOOTH SVG PATH (Catmull-Rom -> cubic Bezier) ---------- */
function smoothPath(pts){
  if(pts.length < 2) return '';
  let d = `M ${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i+1];
    const p3 = pts[i+2] || p2;
    const cp1x = p1[0] + (p2[0]-p0[0])/6;
    const cp1y = p1[1] + (p2[1]-p0[1])/6;
    const cp2x = p2[0] - (p3[0]-p1[0])/6;
    const cp2y = p2[1] - (p3[1]-p1[1])/6;
    d += ` C ${cp1x.toFixed(2)},${cp1y.toFixed(2)} ${cp2x.toFixed(2)},${cp2y.toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
  }
  return d;
}

function showToast(type, title, msg){
  const host = document.getElementById('toastHost');

  el.className = `toast glass-modal toast-${type}`;
  const iconName = type==='success'?'checkCircle':type==='error'?'alert':type==='warning'?'alert':'info';
  el.innerHTML = `${icon(iconName)}<div><div class="toast-title">${esc(title)}</div><div class="toast-msg">${esc(msg)}</div></div><button class="toast-close" data-toast-close>${icon('x')}</button>`;
  host.appendChild(el);
  const timer = setTimeout(()=>remove(), 4200);
  el.querySelector('[data-toast-close]').addEventListener('click', ()=>{ clearTimeout(timer); remove(); });
  function remove(){ el.style.transition='opacity .18s,transform .18s'; el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),180); }
}

/* ---------- KPI card: title · value | meta pct ↗ · slider · View Detail ---------- */
function kpiCard(o){
