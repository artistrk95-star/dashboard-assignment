/* ---------- Revenue series per mode (Day / Week / Month) ---------- */
function revenueSeries(mode){
  const latest = monthlyData[monthlyData.length-1];
  if(mode==='month'){
    const cur = monthlyData.map(m=>m.revenue);
    const prv = monthlyData.map((m,i)=> i ? monthlyData[i-1].revenue : Math.round(m.revenue*0.9));
    return {
      labels: monthlyData.map(m=>m.month.replace(' 2026','').replace(' (MTD)','*')),
      full: monthlyData.map(m=>m.month.replace(' (MTD)',' (MTD)')),
      cur, prv, curLabel:'Current month', prvLabel:'Previous month',
      curTotal: latest.revenue, prvTotal: monthlyData[monthlyData.length-2].revenue, prvPrevTotal: monthlyData[monthlyData.length-3].revenue,
    };
  }
  const curShape = [0.07,0.42,0.68,0.75,0.47,0.52,1.00];
  const prvShape = [0.88,0.46,0.55,0.66,0.30,0.12,0.16];
  if(mode==='day'){
    const peak = latest.revenue/24/3.2;
    const hours = ['09:00','10:00','11:00','12:00','13:00','14:00','15:00'];
    const cur = curShape.map(f=>Math.round(peak*f));
    const prv = prvShape.map(f=>Math.round(peak*f));
    return { labels:hours, full:hours.map(h=>`24 September, 2026 · ${h}`), cur, prv,
      curLabel:'Today', prvLabel:'Yesterday', curTotal:cur.reduce((a,b)=>a+b,0), prvTotal:prv.reduce((a,b)=>a+b,0), prvPrevTotal:prv.reduce((a,b)=>a+b,0)*0.95 };
  }
  const peak = latest.revenue/24*1.9;
  const days = [18,19,20,21,22,23,24];
  const cur = curShape.map(f=>Math.round(peak*f));
  const prv = prvShape.map(f=>Math.round(peak*f));
  return { labels:days.map(d=>`Sep ${d}`), full:days.map(d=>`${d} September, 2026`), cur, prv,
    curLabel:'Current week', prvLabel:'Previous week', curTotal:cur.reduce((a,b)=>a+b,0), prvTotal:prv.reduce((a,b)=>a+b,0), prvPrevTotal:prv.reduce((a,b)=>a+b,0)*1.05 };
}
function segControl(id, mode){
  return `<div class="seg" data-seg="${id}">${['day','week','month'].map(m=>`<button class="${mode===m?'on':''}" data-mode="${m}">${STATE.isRTL?{day:'يوم',week:'أسبوع',month:'شهر'}[m]:m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>`;
}
function deltaBadge(a, b){
  const d = b ? (a-b)/b*100 : 0;
  return `<span class="delta ${d>=0?'up':'down'}">${Math.abs(d).toFixed(0)}%</span>`;
}

function drawRevenueChart(S){
  const D = STATE.dash;
  const wrap = document.getElementById('revChart');
  const w = wrap.clientWidth || 760, h = 300;
  const padL = 58, padR = 8, padT = 70, padB = 10;
  const rawMax = Math.max(...S.cur, ...S.prv);
  const mag = Math.pow(10, Math.floor(Math.log10(rawMax)));
  const maxVal = Math.ceil(rawMax*1.08/mag*2)/2*mag;
  const X0 = padL + 14, X1 = w - padR;
  const stepX = (X1 - X0) / (S.cur.length - 1);
  const y = v => padT + (h-padT-padB) * (1 - v/maxVal);
  const curPts = S.cur.map((v,i)=>[X0 + i*stepX, y(v)]);
  const prvPts = S.prv.map((v,i)=>[X0 + i*stepX, y(v)]);
  const curPath = smoothPath(curPts), prvPath = smoothPath(prvPts);
  const areaPath = curPath + ` L ${curPts[curPts.length-1][0]},${h-padB} L ${curPts[0][0]},${h-padB} Z`;
  const ticks = [0, 1/3, 2/3, 1];
  const grid = ticks.map(f=>{
    const yy = y(maxVal*f);
    return `<line x1="${padL}" y1="${yy}" x2="${X1}" y2="${yy}" stroke="${f===0?'#E2E8F0':'#E9EEF5'}" stroke-width="1" ${f===0?'':'stroke-dasharray="3 6"'}/>
      <text x="${padL-14}" y="${yy+4}" font-size="12" fill="#94A3B8" text-anchor="end" font-family="JetBrains Mono,monospace">${formatCompactAED(maxVal*f)}</text>`;
  }).join('');
  const sel = D.revSel, sp = curPts[sel];
  const cols = curPts.map((p,i)=>`<rect x="${p[0]-stepX/2}" y="0" width="${stepX}" height="${h}" fill="transparent" class="cursor-pointer" data-rev-pt="${i}"/>`).join('');
  wrap.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;">
    <defs><linearGradient id="revArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".26"/><stop offset="70%" stop-color="#2563EB" stop-opacity=".06"/><stop offset="100%" stop-color="#2563EB" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <path d="${areaPath}" fill="url(#revArea)"/>
    <path d="${prvPath}" fill="none" stroke="#F97316" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 7"/>
    <path d="${curPath}" fill="none" stroke="#2563EB" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="${sp[0]}" cy="${sp[1]}" r="17" fill="#2563EB" fill-opacity=".14"/>
    <circle cx="${sp[0]}" cy="${sp[1]}" r="8.5" fill="#fff" stroke="#2563EB" stroke-width="3.5"/>
    <circle cx="${sp[0]}" cy="${sp[1]}" r="2.6" fill="#2563EB"/>
    ${cols}
  </svg>
  <div class="chart-tip" style="left:${Math.min(Math.max(sp[0],80), w-80)}px;top:${Math.max(sp[1]-150, 0)}px;">
    <div class="num" style="font-size:17px;font-weight:700;color:#0F172A;">AED ${S.cur[sel].toLocaleString('en-US')}</div>
    <div style="font-size:12px;color:#64748B;margin-top:4px;">${S.full[sel]}</div>
  </div>`;
  wrap.querySelectorAll('[data-rev-pt]').forEach(r => r.addEventListener('click', ()=>{
    const i = +r.getAttribute('data-rev-pt');
    if(D.revSel === i && D.revMode==='month'){ openDrilldown(i); return; }
    D.revSel = i; drawRevenueChart(S);
  }));
  const labels = document.getElementById('revLabels');
  labels.innerHTML = S.labels.map((l,i)=>`<span class="${i===sel?'on':''}" data-rev-lbl="${i}" style="left:${(curPts[i][0]/w*100).toFixed(3)}%;">${l}</span>`).join('');
  labels.querySelectorAll('[data-rev-lbl]').forEach(l => l.addEventListener('click', ()=>{ D.revSel = +l.getAttribute('data-rev-lbl'); drawRevenueChart(S); }));
}

/* ---------- Collections donut (reference image 2, right) ---------- */
function arcPath(cx, cy, r, startFrac, endFrac){
  const a0 = startFrac*2*Math.PI - Math.PI/2, a1 = endFrac*2*Math.PI - Math.PI/2;
  const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0), x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${endFrac-startFrac>0.5?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function collectionsDonut(){
  const total = invoices.reduce((s,i)=>s+i.grandTotal,0);
  const paid = invoices.filter(i=>i.status==='paid').reduce((s,i)=>s+i.grandTotal,0);
  const open = invoices.filter(i=>i.status==='sent').reduce((s,i)=>s+i.grandTotal-i.paidAmount,0);
  const overdue = invoices.filter(i=>i.status==='overdue').reduce((s,i)=>s+i.grandTotal-i.paidAmount,0);
  const segs = [
    { label:'Outstanding', val:open, color:'#F97316', dir:'up' },
    { label:'Collected', val:paid, color:'#2563EB', dir:'up' },
    { label:'Overdue', val:overdue, color:'#06B6D4', dir:'down' },
  ];
  let cursor = 0.025; const gap = 0.045;
  const arcs = segs.map(s=>{
    const f = s.val/total; const a = arcPath(110,110,86,cursor,cursor+Math.max(f-gap,0.002)); cursor += f;
    return `<path d="${a}" fill="none" stroke="${s.color}" stroke-width="22" stroke-linecap="round"/>`;
  }).join('');
  const legendOrder = [segs[1], segs[0], segs[2]];
  return `
    <div class="flex items-center justify-center" style="flex:1;min-height:230px;position:relative;margin:10px 0 6px;">
      <svg viewBox="0 0 220 220" style="width:190px;height:190px;">
        <circle cx="110" cy="110" r="86" fill="none" stroke="#F1F5F9" stroke-width="22"/>
        ${arcs}
      </svg>
      <div class="absolute text-center">
        <div class="num" style="font-size:30px;font-weight:700;color:#0F172A;line-height:1;">${formatCompactAED(total)}</div>
        <div style="font-size:11px;color:#94A3B8;margin-top:6px;">AED billed</div>
      </div>
    </div>
    <div class="space-y-4">
      ${legendOrder.map(s=>`<div class="legend-row">
        <span class="flex items-center"><span class="legend-dot" style="background:${s.color};"></span>${s.label}</span>
        <span class="num" style="color:#0F172A;font-weight:600;font-size:13.5px;">${formatCompactAED(s.val)} <span style="color:${s.dir==='up'?'#0F172A':'#0F172A'};">${icon(s.dir==='up'?'arrowUpRight':'arrowDownRight','legend-arrow')}</span></span>
        <span class="num text-right" style="color:#94A3B8;font-size:13.5px;">${(s.val/total*100).toFixed(0)}%</span>
      </div>`).join('')}
    </div>`;
}

/* ---------- VAT concentric rings (reference image 3, right) ---------- */
function vatRings(){
  const q3 = monthlyData.slice(-3);
  const supplies = q3.reduce((s,m)=>s+m.revenue,0);
  const outVat = q3.reduce((s,m)=>s+m.vatCollected,0);
  const inVat = q3.reduce((s,m)=>s+m.vatRecoverable,0);
  const net = q3.reduce((s,m)=>s+m.netVatDue,0);
  const elapsed = 86/92;
  const paidShare = invoices.filter(i=>i.status==='paid').reduce((s,i)=>s+i.grandTotal,0) / invoices.reduce((s,i)=>s+i.grandTotal,0);
  const rings = [
    { r:92, f:elapsed*0.86, c:'#2563EB', tip:'Q3 period elapsed' },
    { r:72, f:Math.min(paidShare+0.18,0.9), c:'#F97316', tip:'Output VAT realised' },

function miniStat(label, val){ return `<div class="glass-card-subtle rounded-xl p-3"><div class="text-slate-500" style="font-size:10px;font-weight:600;">${label}</div><div class="font-bold tabular mt-1" style="font-size:14px;">${val}</div></div>`; }

function renderInvoices(){
  const s = STATE.inv;
  let filtered = invoices.filter(i => {
    const matchSearch = !s.search || i.invoiceNumber.toLowerCase().includes(s.search.toLowerCase()) || i.customerName.toLowerCase().includes(s.search.toLowerCase());
    const matchStatus = s.status==='all' || i.status===s.status;
    return matchSearch && matchStatus;
  });
  filtered.sort((a,b)=>{
    let av=a[s.sortKey], bv=b[s.sortKey];
    if(typeof av==='string') { av=av.toLowerCase(); bv=bv.toLowerCase(); }
    if(av<bv) return s.sortDir==='asc'?-1:1;
    if(av>bv) return s.sortDir==='asc'?1:-1;
    return 0;
  });
  const totalPages = Math.max(1, Math.ceil(filtered.length / s.pageSize));

            ${cols.map(c=>`<th class="th-sort" data-sort="${c.key}"><span class="th-sort-inner">${c.label} ${s.sortKey===c.key ? icon(s.sortDir==='asc'?'chevUp':'chevDown') : icon('chevsUpDown')}</span></th>`).join('')}
            <th></th>

          <tbody>
            ${pageItems.map(i => `

  }));
  document.getElementById('selectAllRows').addEventListener('change', (e)=>{
    pageItems.forEach(i => e.target.checked ? s.selected.add(i.id) : s.selected.delete(i.id));
    renderInvoices();
  });
  document.querySelectorAll('.row-check').forEach(cb => cb.addEventListener('change', (e)=>{
    const id = cb.getAttribute('data-check');
    e.target.checked ? s.selected.add(id) : s.selected.delete(id);
    renderInvoices();
  }));
  const bulkPaid = document.getElementById('bulkMarkPaid');

  if(bulkDel) bulkDel.addEventListener('click', ()=>{
    invoices = invoices.filter(i => !s.selected.has(i.id));

    s.selected.clear(); renderInvoices();
  });
}
function exportInvoicesCsv(list){
  const header = ['Invoice #','Customer','TRN','Issue Date','Due Date','Subtotal','VAT','Grand Total','Status'];
  const rows = list.map(i => [i.invoiceNumber, i.customerName, i.customerTRN, i.issueDate, i.dueDate, i.subtotal.toFixed(2), i.vatTotal.toFixed(2), i.grandTotal.toFixed(2), i.status]);
  const csv = [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'qistna-invoices.csv';
  document.body.appendChild(a); a.click(); a.remove();

function dueDateFromTerms(issueDate, terms){
  const days = {'Net 15':15,'Net 30':30,'Net 60':60,'Net 90':90}[terms] || 30;
  const d = new Date(issueDate + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

function ddDot(c){ return c ? `<span style="width:7px;height:7px;border-radius:99px;background:${c};flex-shrink:0;"></span>` : ''; }
function ddHTML(id, options, value, o){
  o = o || {};
  const cur = options.find(x=>!x.sep && x.value===value) || options.find(x=>!x.sep);
  const trigger = o.menu
    ? (o.menuLabel===''
        ? `<button type="button" class="btn btn-ghost btn-icon btn-sm" data-dd-trigger aria-haspopup="menu" aria-expanded="false" aria-label="Row actions">${icon(o.menuIcon||'more')}</button>`
        : `<button type="button" class="btn btn-outline btn-md" data-dd-trigger aria-haspopup="menu" aria-expanded="false">${o.menuIcon?icon(o.menuIcon):''}<span>${o.menuLabel||'Actions'}</span><span class="chev">${icon('chevDown')}</span></button>`)
    : `<button type="button" class="dd-trigger" data-dd-trigger aria-haspopup="listbox" aria-expanded="false"${o.ariaLabel?` aria-label="${esc(o.ariaLabel)}"`:''}>
         <span class="dd-cur flex items-center gap-2 truncate">${cur.icon?icon(cur.icon):''}${ddDot(cur.dot)}<span>${cur.label}</span></span>
         <span class="chev">${icon('chevDown')}</span></button>`;
  return `<div class="dd" id="${id}" data-value="${esc(cur.value)}" style="${o.width?`width:${o.width};`:''}${o.menu?'width:auto;':''}">
    ${trigger}
    <div class="dd-menu" role="${o.menu?'menu':'listbox'}" style="${o.menu?'min-width:210px;':''}${o.alignEnd?'inset-inline-start:auto;inset-inline-end:0;':''}">
      ${options.map(x=> x.sep ? '<div class="dd-sep"></div>' :
        `<button type="button" role="${o.menu?'menuitem':'option'}" class="dd-opt ${x.danger?'danger':''}" data-v="${esc(x.value)}" data-l="${esc(x.label)}" data-dot="${x.dot||''}" data-ic="${x.icon||''}" ${o.menu?'':`aria-selected="${x.value===cur.value}"`} tabindex="-1">
           ${x.icon?icon(x.icon):''}${ddDot(x.dot)}<span>${x.label}</span>${o.menu?'':`<span class="tick">${icon('check')}</span>`}</button>`).join('')}
    </div>
  </div>`;
}
function closeAllDropdowns(except){
  document.querySelectorAll('.dd.open').forEach(d=>{ if(d!==except){ d.classList.remove('open'); const t=d.querySelector('[data-dd-trigger]'); if(t) t.setAttribute('aria-expanded','false'); } });
}
document.addEventListener('click', (e)=>{ if(!e.target.closest('.dd')) closeAllDropdowns(); });
function initDropdown(id, onChange, o){
  o = o || {};
  const dd = document.getElementById(id); if(!dd) return;
  const trig = dd.querySelector('[data-dd-trigger]');
  const opts = ()=> Array.from(dd.querySelectorAll('.dd-opt'));
  let ai = -1;
  const setActive = (i)=>{ ai = i; opts().forEach((b,j)=>b.classList.toggle('active', j===i)); if(opts()[i]) opts()[i].focus({preventScroll:true}); };
  const open = ()=>{ closeAllDropdowns(dd); dd.classList.add('open'); trig.setAttribute('aria-expanded','true'); const s = opts().findIndex(b=>b.getAttribute('aria-selected')==='true'); setActive(s<0?0:s); };
  const close = (focus)=>{ dd.classList.remove('open'); trig.setAttribute('aria-expanded','false'); opts().forEach(b=>b.classList.remove('active')); if(focus) trig.focus(); };
  trig.addEventListener('click', ()=> dd.classList.contains('open') ? close() : open());
  trig.addEventListener('keydown', (e)=>{ if(['ArrowDown','ArrowUp'].includes(e.key)){ e.preventDefault(); open(); } });
  dd.querySelector('.dd-menu').addEventListener('keydown', (e)=>{
    const n = opts().length;
    if(e.key==='ArrowDown'){ e.preventDefault(); setActive((ai+1)%n); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); setActive((ai-1+n)%n); }
    else if(e.key==='Home'){ e.preventDefault(); setActive(0); }
    else if(e.key==='End'){ e.preventDefault(); setActive(n-1); }
    else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); close(true); }
    else if(e.key==='Tab'){ close(); }
  });
  opts().forEach(b => b.addEventListener('click', ()=>{
    const v = b.getAttribute('data-v');
    if(!o.menu){
      opts().forEach(x=>x.setAttribute('aria-selected', String(x===b)));
      dd.dataset.value = v;
      const ic = b.getAttribute('data-ic');
      dd.querySelector('.dd-cur').innerHTML = `${ic?icon(ic):''}${ddDot(b.getAttribute('data-dot'))}<span>${b.getAttribute('data-l')}</span>`;
    }
    close(true);
    if(onChange) onChange(v);
  }));
}

function countTokens(){
  let n = 0;
  for(const sh of document.styleSheets){ try{ for(const r of sh.cssRules){ if(r.selectorText===':root') for(const p of r.style){ if(/^--(color|fs|fw|lh|space|radius|elev|dur|ease|focus)/.test(p)) n++; } } }catch(e){} }
  return n;
}
function renderDsTable(){
  const D = STATE.ds;
  const rows = invoices.slice(0,6).slice().sort((a,b)=>{
    const va = a[D.sortKey], vb = b[D.sortKey];
    const c = typeof va==='number' ? va-vb : String(va).localeCompare(String(vb));
    return D.dir==='asc' ? c : -c;
  });
  const cols = [['invoiceNumber','Invoice #'],['customerName','Customer'],['issueDate','Issued'],['status','Status'],['grandTotal','Total']];
  const arrow = k => D.sortKey!==k ? icon('chevsUpDown') : (D.dir==='asc' ? icon('chevUp') : icon('chevDown'));
  document.getElementById('dsTableWrap').innerHTML = `<div class="table-wrap" style="border-radius:var(--radius-md);border:1px solid rgba(148,163,184,.2);">
    <table><thead><tr>${cols.map(([k,l])=>`<th class="th-sort" data-ds-sort="${k}" aria-sort="${D.sortKey===k?(D.dir==='asc'?'ascending':'descending'):'none'}" style="${k==='grandTotal'?'text-align:right;':''}"><span class="th-sort-inner" style="${k==='grandTotal'?'justify-content:flex-end;':''}">${l}${arrow(k)}</span></th>`).join('')}</tr></thead>
    <tbody>${rows.map(i=>`<tr class="row-hover"><td class="mono font-semibold">${i.invoiceNumber}</td><td>${esc(i.customerName)}</td><td>${formatDate(i.issueDate)}</td><td>${statusChip(i.status)}</td><td class="tabular font-bold" style="text-align:right;">${formatAED(i.grandTotal)}</td></tr>`).join('')}</tbody></table></div>
    <div class="tok mt-2">Sorted by <b>${cols.find(c=>c[0]===D.sortKey)[1]}</b> · ${D.dir==='asc'?'ascending':'descending'}</div>`;
  document.querySelectorAll('[data-ds-sort]').forEach(th => th.addEventListener('click', ()=>{
    const k = th.getAttribute('data-ds-sort');
    if(D.sortKey===k) D.dir = D.dir==='asc'?'desc':'asc'; else { D.sortKey=k; D.dir = k==='grandTotal'?'desc':'asc'; }
    renderDsTable();
  }));
}

            <td>${formatDate(i.dueDate)}</td>
            <td>${statusChip(i.status)}</td>
            <td class="tabular font-bold" style="text-align:right;">${formatAED(i.grandTotal)}</td>
            <td style="text-align:right;"><div class="${idx>=rows.length-2 && rows.length>3 ? 'dd-up' : ''}">${ddHTML('ract-'+i.id, actionsFor(i), null, {menu:true, menuLabel:'', menuIcon:'more', alignEnd:true})}</div></td>
          </tr>`).join('') : `<tr><td colspan="7"><div class="empty-state">${icon('search')}<div class="font-semibold mt-2" style="font-size:var(--fs-sm);color:var(--color-ink);">No invoices match</div><div class="text-slate-500" style="font-size:var(--fs-xs);">Try another search or status.</div><button class="btn btn-outline btn-sm mt-3" id="recentClear">Clear filters</button></div></td></tr>`}
        </tbody>
      </table>
    </div>`;

  const search = document.getElementById('recentSearch');
  search.addEventListener('input', ()=>{ R.q = search.value; clearTimeout(R._t); R._t = setTimeout(()=>{ const pos = search.selectionStart; renderRecentInvoices(); const s2=document.getElementById('recentSearch'); s2.focus(); s2.setSelectionRange(pos,pos); }, 160); });
  if(hadFocus){ search.focus(); }
  initDropdown('recentStatus', v=>{ R.status = v; renderRecentInvoices(); });
  document.getElementById('recentViewAll').addEventListener('click', ()=>{ STATE.inv.status = R.status; STATE.inv.search = R.q; STATE.inv.page = 1; navigate('invoices'); });
  document.getElementById('recentNew').addEventListener('click', ()=> navigate('create-invoice'));
  const clr = document.getElementById('recentClear'); if(clr) clr.addEventListener('click', ()=>{ R.q=''; R.status='all'; renderRecentInvoices(); });
  host.querySelectorAll('[data-rsort]').forEach(th => th.addEventListener('click', ()=>{
    const k = th.getAttribute('data-rsort');
    if(R.sortKey===k) R.dir = R.dir==='asc'?'desc':'asc'; else { R.sortKey = k; R.dir = (k==='grandTotal'||k==='issueDate'||k==='dueDate') ? 'desc' : 'asc'; }
    renderRecentInvoices();
  }));
  host.querySelectorAll('[data-rview]').forEach(b => b.addEventListener('click', ()=> openInvoiceDetail(b.getAttribute('data-rview'))));
  rows.forEach(i => initDropdown('ract-'+i.id, v => recentAction(i, v), {menu:true}));
}
function recentAction(inv, act){
  if(act==='view') return openInvoiceDetail(inv.id);
  if(act==='remind') return showToast('info','Reminder sent', `Payment reminder for ${inv.invoiceNumber} emailed to ${inv.customerName}.`);
  if(act==='paid'){
    inv.status = 'paid'; inv.paidAmount = inv.grandTotal;
    showToast('success','Marked as paid', `${inv.invoiceNumber} · ${formatAED(inv.grandTotal)} received. KPIs updated.`);
    return renderDashboard();
  }
  if(act==='delete'){
    openModal('genericModal', `
      <div class="modal-head"><div class="flex items-center gap-3">
        <div style="width:40px;height:40px;border-radius:var(--radius-md);background:var(--color-danger-bg);border:1px solid var(--color-danger-border);display:flex;align-items:center;justify-content:center;color:var(--color-danger);">${icon('trash')}</div>
        <div><div class="card-title">Delete draft invoice?</div><p class="text-slate-500 mt-0_5" style="font-size:var(--fs-xs);">${inv.invoiceNumber} · ${esc(inv.customerName)}</p></div></div>
        <button class="modal-close glass-pill" data-close="genericModal" aria-label="Close">${icon('x')}</button></div>
      <p style="font-size:var(--fs-sm);color:var(--color-text);line-height:var(--lh-relaxed);">This draft has not been issued, so no VAT has been recorded against it. Deleting it cannot be undone.</p>
      <div class="modal-foot" style="justify-content:flex-end;">
        <button class="btn btn-outline btn-md" data-close="genericModal">Keep draft</button>
        <button class="btn btn-destructive btn-md" id="recentConfirmDelete">${icon('trash')}<span>Delete draft</span></button>
      </div>`);
    document.getElementById('genericModalBody').style.maxWidth = '460px';
    document.getElementById('recentConfirmDelete').addEventListener('click', ()=>{
      invoices = invoices.filter(x => x.id !== inv.id);
      closeModal('genericModal'); document.getElementById('genericModalBody').style.maxWidth='';
      showToast('success','Draft deleted', `${inv.invoiceNumber} was removed.`);
      renderSidebar(); renderDashboard();
    });
  }
}

/* ==========================================================================
   INSPECT TOKENS — hover any element in the live UI to see the component
   and the design tokens it resolves to (read from computed styles)
   ========================================================================== */
const INSPECT_MAP = [
  ['.btn-cta','Button · Primary CTA'], ['.btn-primary','Button · Primary'], ['.btn-accent','Button · Accent'], ['.btn-outline','Button · Outline'],
  ['.btn-ghost','Button · Ghost'], ['.btn-destructive','Button · Destructive'], ['.kpi2-link','Link button'],
  ['.dd-opt','Dropdown · Option'], ['.dd-menu','Dropdown · Menu'], ['.dd-trigger','Dropdown · Listbox'],
  ['.seg','Segmented control'], ['.ask-trigger','Search · Command bar'], ['.lang-toggle','Toggle · Language'], ['.currency-pill','Toggle · Currency'],
  ['.field input, .field select, .field textarea','Input'], ['.input-group .addon','Input · Add-on'],
  ['.chip','Status chip'], ['.delta','Trend badge'], ['.nav-badge','Badge'],
  ['th','Data table · Header cell'], ['td','Data table · Cell'],
  ['.nav-item','Navigation item'], ['.glass-kpi-blue, .glass-kpi-cyan, .glass-kpi-peach','KPI card'],
  ['.mini-stat','Stat tile'], ['.glass-modal','Modal / Toast surface'], ['.glass-card','Card · Glass surface'],
  ['h1','Heading 1'], ['.card-h','Heading 2'], ['.card-title','Heading 3'],
];
const INSPECT_SEL = INSPECT_MAP.map(m=>m[0]).join(',');
let _tokIndex = null;
function tokenIndex(){
  if(_tokIndex) return _tokIndex;
  const idx = { color:{}, radius:{}, fs:{}, fw:{}, elev:{} };
  const cs = getComputedStyle(document.documentElement);
  const probe = document.createElement('div'); document.body.appendChild(probe);
  for(const sh of document.styleSheets){ try{ for(const r of sh.cssRules){ if(r.selectorText!==':root') continue; for(const p of r.style){
    const v = cs.getPropertyValue(p).trim();
    if(p.startsWith('--color-')){ probe.style.color = v; idx.color[getComputedStyle(probe).color] = idx.color[getComputedStyle(probe).color] || p; }
    else if(p.startsWith('--radius-')) idx.radius[v] = p;
    else if(p.startsWith('--fs-')) idx.fs[v] = p;
    else if(p.startsWith('--fw-')) idx.fw[v] = p;
    else if(p.startsWith('--elev-')){ probe.style.boxShadow = v; idx.elev[getComputedStyle(probe).boxShadow] = p; }
  } } }catch(e){} }
  probe.remove();
  return (_tokIndex = idx);
}
function toHex(rgb){ const m = rgb.match(/\d+(\.\d+)?/g); if(!m) return rgb; const [r,g,b,a] = m.map(Number); if(a===0) return 'transparent'; return '#'+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('').toUpperCase()+(a!==undefined && a<1?` · ${Math.round(a*100)}%`:''); }
function describeTokens(el){
  const cs = getComputedStyle(el), T = tokenIndex(), out = [];
  const tok = (label, val, name) => out.push(`<div class="insp-row"><span>${label}</span><b>${val}</b>${name?`<code>${name}</code>`:'<code class="off">raw</code>'}</div>`);
  const bg = cs.backgroundColor;
  if(bg && !bg.includes('0, 0, 0, 0')) tok('Fill', toHex(bg), T.color[bg]);
  else if(cs.backgroundImage && cs.backgroundImage!=='none') out.push(`<div class="insp-row"><span>Fill</span><b>Glass gradient</b><code>--glass-fill</code></div>`);
  tok('Text', toHex(cs.color), T.color[cs.color]);
  tok('Type', `${cs.fontSize} / ${cs.fontWeight}`, [T.fs[cs.fontSize], T.fw[cs.fontWeight]].filter(Boolean).join(' · ') || null);
  const r = cs.borderTopLeftRadius; if(r && r!=='0px') tok('Radius', r, T.radius[r] || (parseFloat(r)>=999?'--radius-full':null));
  if(cs.paddingTop!=='0px' || cs.paddingLeft!=='0px') out.push(`<div class="insp-row"><span>Padding</span><b>${cs.paddingTop} ${cs.paddingRight}</b><code>--space-*</code></div>`);
  if(cs.boxShadow && cs.boxShadow!=='none'){ const e = T.elev[cs.boxShadow]; out.push(`<div class="insp-row"><span>Elevation</span><b>${e?e.replace('--elev-','Level '):'Glass'}</b><code>${e||'--glass-shadow'}</code></div>`); }
  return out.join('');
}
function setInspect(on){
  STATE.inspect = on;
  document.body.classList.toggle('inspecting', on);
  const b = document.getElementById('inspectToggle'); if(b){ b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }
  const tip = document.getElementById('inspTip'); if(tip) tip.hidden = true;
  document.querySelectorAll('.insp-target').forEach(e=>e.classList.remove('insp-target'));
  if(on) showToast('info','Inspect tokens on','Hover any element to see its component and tokens. Clicks are paused — press Esc to exit.');
}
(function initInspector(){
  const btn = document.createElement('button');
  btn.id = 'inspectToggle'; btn.className = 'inspect-fab'; btn.setAttribute('aria-pressed','false');
  btn.innerHTML = `${icon('palette')}<span>Inspect tokens</span><kbd>I</kbd>`;
  document.body.appendChild(btn);
  const tip = document.createElement('div'); tip.id = 'inspTip'; tip.className = 'insp-tip'; tip.hidden = true; document.body.appendChild(tip);
  btn.addEventListener('click', (e)=>{ e.stopPropagation(); setInspect(!STATE.inspect); });
  let last = null;
  document.addEventListener('mousemove', (e)=>{
    if(!STATE.inspect) return;
    if(e.target.closest('#inspectToggle, #inspTip, .toast')){ tip.hidden = true; if(last) last.classList.remove('insp-target'); last=null; return; }
    const el = e.target.closest(INSPECT_SEL);
    if(el !== last){ if(last) last.classList.remove('insp-target'); last = el; if(el){ el.classList.add('insp-target');
      const name = (INSPECT_MAP.find(m=>el.matches(m[0]))||[])[1] || 'Element';
      tip.innerHTML = `<div class="insp-name">${name}</div>${describeTokens(el)}`; } }
    if(!el){ tip.hidden = true; return; }
    tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 16, y = e.clientY + 18;
    if(x + w > innerWidth - 8) x = e.clientX - w - 16;
    if(y + h > innerHeight - 8) y = e.clientY - h - 18;
    tip.style.left = x+'px'; tip.style.top = y+'px';
  });
  document.addEventListener('click', (e)=>{ if(STATE.inspect && !e.target.closest('#inspectToggle, .toast')){ e.preventDefault(); e.stopPropagation(); } }, true);
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape' && STATE.inspect){ setInspect(false); }
    const tag = (e.target.tagName||'').toLowerCase();
    if((e.key==='i' || e.key==='I') && !e.metaKey && !e.ctrlKey && !e.altKey && !['input','textarea','select'].includes(tag) && !e.target.isContentEditable) setInspect(!STATE.inspect);
  });
})();

/* ---------- INIT ---------- */
render();

})();

</script>
